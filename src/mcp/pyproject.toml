[project]
name = "augur-mcp"
version = "1.0.0"
description = "MCP Server for AI Skills - modular, configurable, extensible"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Gur Sannikov" }
]
keywords = ["mcp", "claude", "skills", "llm", "ai", "augur"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# For users running within full augur monorepo
full = [
    "anthropic>=0.30.0",
]
# Wizard CLI dependencies
wizard = [
    "typer>=0.9.0",
    "rich>=13.0.0",
    "questionary>=2.0.0",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
# All optional dependencies
all = [
    "augur-mcp[full,wizard,dev]",
]

[project.scripts]
augur-mcp = "augur_framework.__main__:main"
augur-core = "augur_core.__main__:main"
augur-framework = "augur_framework.__main__:main"
augur-wizard = "augur_framework.tools.wizard.cli:main"

[project.entry-points."augur_mcp.registry"]
filesystem = "augur_shared.adapters.filesystem_registry:FilesystemSkillRegistry"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["augur_core", "augur_framework", "augur_shared"]

[tool.hatch.build.targets.sdist]
include = [
    "/augur_core",
    "/augur_framework",
    "/augur_shared",
    "/tests",
    "/README.md",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "contract: MCP tool contract tests (verify input/output schemas)",
    "e2e: End-to-end workflow tests",
    "slow: Tests that take >5s to run",
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
