# gitleaks configuration.
#
# Extends the upstream default ruleset (so all real secret detection stays
# active) and adds a narrow allowlist for test fixtures that *intentionally*
# embed fake credentials to exercise Augur's own secret/partition scanners.
# These are not real secrets — they are the inputs the scanners are tested
# against. Compiled .pyc bytecode (build artifacts, never committed) is also
# allowlisted so local --no-git scans stay clean.
[extend]
useDefault = true

[allowlist]
description = "Fake-secret fixtures for Augur's own secret/partition scanners (not real credentials); compiled bytecode."
paths = [
  '''tests/test_partition_integrity\.py''',
  '''tests/test_security_scan\.py''',
  '''\.pyc$''',
]
