version: 1.0.0
description: CLI-specific stream parsing overrides for Operation Mode chat view
profiles:
  claude:
    cli_id: claude
    supports_structured_output: false
    streaming_delimiter: null
    prompt_patterns:
    - Do you want to (?:run|use|execute)\s+(.+)\?\s*$
    - Would you like (?:me to|to) (.+)\?\s*$
    tool_approval_pattern: (?:Do you want to|Allow) (?:run|use|execute)\s+(.+)\?
    progress_patterns:
    - "\u23FA\\s+(.+)"
    - \[\d+/\d+\]
    error_patterns:
    - API error:\s*(.+)
    - Rate limit exceeded
    - Invalid API key
    - Context window exceeded
    tui_indicators:
    - "\u276F"
    - "\u25EF"
    - "\u25C9"
  codex:
    cli_id: codex
    supports_structured_output: false
    streaming_delimiter: null
    prompt_patterns:
    - Approve\?\s*\(y/n\)
    - Accept changes\?
    tool_approval_pattern: Approve\?\s*\(y/n\)
    progress_patterns:
    - Reading\s+(.+)
    - Writing\s+(.+)
    - Applying patch
    error_patterns:
    - codex error:\s*(.+)
    - sandbox error
    tui_indicators: []
  gemini:
    cli_id: gemini
    supports_structured_output: false
    streaming_delimiter: null
    prompt_patterns:
    - Shall I proceed\?
    - Continue\?\s*\[Y/n\]
    tool_approval_pattern: null
    progress_patterns: []
    error_patterns:
    - gemini error:\s*(.+)
    tui_indicators: []
  cursor-cli:
    cli_id: cursor-cli
    supports_structured_output: false
    streaming_delimiter: null
    prompt_patterns: []
    tool_approval_pattern: null
    progress_patterns: []
    error_patterns: []
    tui_indicators: []
  kimi:
    cli_id: kimi
    supports_structured_output: false
    streaming_delimiter: null
    prompt_patterns: []
    tool_approval_pattern: null
    progress_patterns: []
    error_patterns: []
    tui_indicators: []
  opencode:
    cli_id: opencode
    supports_structured_output: false
    streaming_delimiter: null
    prompt_patterns: []
    tool_approval_pattern: null
    progress_patterns: []
    error_patterns: []
    tui_indicators: []
  claude-kimi:
    cli_id: claude-kimi
    supports_structured_output: false
    streaming_delimiter: null
    prompt_patterns:
    - Do you want to (?:run|use|execute)\s+(.+)\?\s*$
    tool_approval_pattern: (?:Do you want to|Allow) (?:run|use|execute)\s+(.+)\?
    progress_patterns: []
    error_patterns: []
    tui_indicators: []
schema_version: 1
