# Dashboard generated surface policy.
#
# ignored-runtime surfaces are regenerated by /dev-build, start-dev.sh, or
# package lifecycle hooks. They may include local vault/project-brain skill
# inventory and must not be tracked in Git.
#
# tracked-bootstrap surfaces are deterministic repo-only derivatives that keep a
# fresh clone importable before the dashboard generator has run.
surfaces:
  - path: apps/dashboard/app/adaptive
    classification: ignored-runtime
    input_scope: client-skill-dirs
    generator: apps/dashboard/scripts/dist/mount-plugins.mjs
    reason: Catch-all hub route generated from repo, project-brain, and vault skills.
  - path: apps/dashboard/app/brain
    classification: ignored-runtime
    input_scope: client-skill-dirs
    generator: apps/dashboard/scripts/dist/mount-plugins.mjs
    reason: Catch-all hub route generated from repo, project-brain, and vault skills.
  - path: apps/dashboard/app/command
    classification: ignored-runtime
    input_scope: client-skill-dirs
    generator: apps/dashboard/scripts/dist/mount-plugins.mjs
    reason: Catch-all hub route generated from repo, project-brain, and vault skills.
  - path: apps/dashboard/app/dev
    classification: ignored-runtime
    input_scope: client-skill-dirs
    generator: apps/dashboard/scripts/dist/mount-plugins.mjs
    reason: Developer hub route generated from discovered client skills.
  - path: apps/dashboard/features/generated-skill-pages
    classification: ignored-runtime
    input_scope: client-skill-dirs
    generator: apps/dashboard/scripts/dist/mount-plugins.mjs
    reason: Dashboard-local copies of skill pages generated from discovered client skills.
  - path: apps/dashboard/lib/blocks/custom-block-registry.ts
    classification: ignored-runtime
    input_scope: client-skill-dirs
    generator: apps/dashboard/scripts/dist/generate-tab-registry.mjs
    reason: Custom block imports are derived from discovered skill page YAML.
  - path: apps/dashboard/lib/blocks/generated-block-registry.ts
    classification: ignored-runtime
    input_scope: client-skill-dirs
    generator: apps/dashboard/scripts/dist/generate-block-registry.mjs
    reason: Block manifests are derived from discovered client skills.
  - path: apps/dashboard/lib/browse/generated-item-actions.ts
    classification: ignored-runtime
    input_scope: client-skill-dirs
    generator: apps/dashboard/scripts/dist/generate-item-actions.mjs
    reason: Browse per-item actions are derived from skill-owned augur/browse-actions.yaml files.
  - path: apps/dashboard/lib/tabs/generated-registry.ts
    classification: ignored-runtime
    input_scope: client-skill-dirs
    generator: apps/dashboard/scripts/dist/generate-tab-registry.mjs
    reason: Tab registry may include private vault/project-brain skills.
  - path: apps/dashboard/lib/tabs/generated-skill-nav.ts
    classification: ignored-runtime
    input_scope: client-skill-dirs
    generator: apps/dashboard/scripts/dist/generate-tab-registry.mjs
    reason: Standalone skill nav may include private vault/project-brain skills.
  - path: config/dashboard/generated
    classification: ignored-runtime
    input_scope: client-skill-dirs
    generator: apps/dashboard/scripts/dist/mount-plugins.mjs
    reason: Generated dashboard assembly snapshots are runtime and cache material.
  - path: apps/dashboard/lib/generated-config-modules.d.ts
    classification: tracked-bootstrap
    input_scope: repo-only
    generator: manual bootstrap declaration
    reason: Stable TypeScript declaration needed before generated config pages exist.
