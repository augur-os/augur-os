schema_version: 1
theme: dark
notifications: true

local_backends:
  default: ollama
  ollama:
    binary: null
    model: qwen3.5:9b
    agent: claude
    context_length: 32768
    agent_models:
      codex: augur-codex-qwen2.5-coder:7b-4k
    extra_args: []
  whisper:
    model: whisper-large-v3-int8-ov
    devices:
      - NPU
      - GPU
      - CPU
  ollama_ocr:
    model_tag: glm-ocr

airplane_mode:
  enabled: false
  forced: false
  auto_detect: true
  fallback_tools:
    - web-search
    - web-fetch
    - knowledge-summarize-url

client_routing:
  default_client: null
  overrides: {}

rag:
  chunk_size: 1500
  chunk_overlap: 200
  document_chunk_size: 1000
  code_chunk_size: 2000
  code_chunk_overlap: 100
  small_file_threshold: 500
  bm25_top_k: 50
  rrf_k: 60
  final_top_k: 10
  contextualization:
    enabled: true
    model: qwen3.5:9b
    max_context_tokens: 100
    ollama_url: "http://localhost:11434"
  ocr:
    enabled: true
    backend: glm-ocr
