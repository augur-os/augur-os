# MCP Remote Access Configuration
# Used by start_remote_mcp.py to launch a second MCP instance for remote clients

transport: streamable-http
host: 127.0.0.1  # Caddy proxies external traffic to this
port: 8000

auth:
  enabled: true
  type: oauth  # Uses existing Augur OAuth provider

# Tool scoping for remote clients
# These tools are blocked for remote MCP connections (security-sensitive)
blocked_tools:
  - system-open           # Opens files on server desktop
  - system-open-file      # Opens files on server desktop
  - send-ide-prompt       # Sends to server's local IDE
  - get-ide-status        # Reads server's IDE state

# Session limits
max_concurrent_clients: 5
session_timeout_hours: 24
