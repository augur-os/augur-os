# Plugin Configuration
# Manage which skill bundles are enabled/disabled
#
# Skills are discovered from skills/ at project root and
# other configured directories. See discovery section below.
#
# By default, all discovered bundles are enabled unless explicitly disabled.

version: 1

# Mode: "allowlist" (only listed bundles) or "denylist" (all except listed)
mode: denylist

# Bundles to explicitly disable (when mode is denylist)
disabled_bundles: []

# Bundles to explicitly enable (when mode is allowlist)
# enabled_bundles:
#   - core
#   - services
#   - apps
#   - crew

# Skill-level overrides (apply regardless of bundle state)
skills:
  # Explicitly enable specific skills even if bundle is disabled
  force_enabled: []

  # Explicitly disable specific skills even if bundle is enabled
  force_disabled: []

# Multi-tier skill discovery
# Skills can be discovered from multiple locations
discovery:
  # Enable user global skills from ~/.claude/plugins/cache/
  user_global: true

  # Enable project-specific skills from skills/
  project_local: true

  # Additional skill directories to scan
  additional_paths: []
