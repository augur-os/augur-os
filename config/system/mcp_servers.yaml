# Augur MCP server topology manifest.
# Source-of-truth for which MCP servers should be registered with AI clients
# (Claude Code, Codex, Gemini, Copilot).
#
# Read by:
#   - aug config sync             — to write client configs
#   - augur_shared.plugin_tools   — to apply monolith_exclusions during skill scan
#   - augur_shared.bundle_server  — to resolve a bundle's launch parameters
#
# Layer 1 spec: docs/superpowers/specs/2026-04-28-cross-client-bundle-architecture-design.md
# Track 2 spec: docs/superpowers/specs/2026-04-29-track2-vault-server-split-design.md

# Project-scoped servers ship with Augur framework and are emitted to the
# checkout-local `.mcp.json`; home client configs stay user/global scoped.
# Track 3a PR 6 (atomic switchover): the legacy `augur` monolith was
# replaced with augur-core + augur-framework. Run `aug config sync` after
# pulling main to rewrite client configs (timestamped backups created
# automatically). Reload Claude Code / Codex / Gemini / Copilot sessions.
project_tier:
  - id: augur-core
    description: Project-tier registry/discovery server (Track 3a)
    scope: project
    command: python
    args: [-m, augur_core]
    startup_timeout_sec: 90
    cwd_required: true
    env:
      PYTHONPATH: "${AUGUR_ROOT}/project-brain/capabilities:${AUGUR_ROOT}:${AUGUR_ROOT}/src/mcp"
      PYTHONUNBUFFERED: "1"
    per_client_args:
      claude: ["--client-id", "claude"]
      codex: ["--client-id", "codex"]
      gemini: ["--client-id", "gemini"]
      copilot: ["--client-id", "copilot"]

  - id: augur-framework
    description: Project-tier operational server (Track 3a)
    scope: project
    command: python
    args: [-m, augur_framework]
    cwd_required: true
    env:
      PYTHONPATH: "${AUGUR_ROOT}/project-brain/capabilities:${AUGUR_ROOT}:${AUGUR_ROOT}/src/mcp"
      PYTHONUNBUFFERED: "1"
    per_client_args:
      claude: ["--client-id", "claude"]
      codex: ["--client-id", "codex"]
      gemini: ["--client-id", "gemini"]
      copilot: ["--client-id", "copilot"]

# Vault-tier per-bundle servers.
#
# Only active Brain/private-vault capabilities are registered here. Skills moved
# to vault staging must not remain listed, otherwise client sync can resurrect
# dashboard/tool surfaces that are no longer active.
vault_tier:
  - id: augur-vault
    description: Obsidian vault integration (notes / metadata / search)
    scope: global
    command: python
    args: [-m, augur_shared.bundle_server, vault]
    bundle: vault
    bundle_path: ~/Projects/Au-vault/capabilities/skills/vault
    env:
      PYTHONPATH: "${AUGUR_ROOT}/project-brain/capabilities:${AUGUR_ROOT}:${AUGUR_ROOT}/src/mcp"
      PYTHONUNBUFFERED: "1"
  - id: augur-ingest
    description: Inbox / wiki / URL capture / source cards
    scope: global
    command: python
    args: [-m, augur_shared.bundle_server, ingest]
    bundle: ingest
    bundle_path: ${AUGUR_ROOT}/project-brain/capabilities/skills/ingest
    env:
      PYTHONPATH: "${AUGUR_ROOT}/project-brain/capabilities:${AUGUR_ROOT}:${AUGUR_ROOT}/src/mcp"
      PYTHONUNBUFFERED: "1"

# Bundles excluded from the monolith's skill scan because they're served
# by per-bundle vault-tier servers. Modified by Track 2 PRs 2-6.
monolith_exclusions:
  - vault
  - ingest
