# config/system/partition_policy.yaml
#
# Defines the public/private partition for the public augur-os release. Read by
# src/lib/partition_integrity.py to prove the public partition carries no private
# content under release_scope: full. See
# docs/superpowers/specs/2026-06-16-public-soft-launch-readiness-design.md.
#
# The scanner walks the WHOLE repo root and reports findings, EXCLUDING only the
# directories named in `exclude_dirs` and paths matching `exclude_globs`. Under
# `full` scope "the whole repo" means every top-level file (CLAUDE.md,
# project.yaml, README.md, ...) and every top-level dir is in scope — there is no
# allowlist of scan roots. This is a privacy gate: it errs toward over-reporting,
# because a false "clean" is the dangerous failure.
#
# IMPORTANT: never commit personal markers (names, emails, client ids) here —
# that would itself be a partition bug. The private-marker regex is supplied at
# runtime via the AUGUR_PRIVATE_MARKER_REGEX environment variable (set from a CI
# secret), not from this file.

# Repo-relative globs that must NOT exist in the public partition. They belong to
# the private side (Au-vault / private brain).
#
# project-brain/knowledge/{wiki,memory} is intentionally PUBLIC project knowledge
# about Augur (decided 2026-06-16); personal markers inside it are genericized
# rather than relocated. Only explicitly-private files (`*.private.*`) are barred.
private_paths:
  - "**/*.private.*"

# File suffixes that must never be published (matched case-insensitively).
forbidden_suffixes:
  - ".pem"
  - ".key"
  - ".env"

# Exact / dotfile filenames that must never be published. Dotfiles like `.env`
# have an empty suffix, so the suffix list alone cannot catch them; entries that
# start with "." also match name-prefixes (e.g. `.env` matches `.env.local`).
forbidden_names:
  - ".env"

# Secret-like token patterns (Python re syntax).
secret_patterns:
  - "(?i)\\b(secret|api[_-]?key|access[_-]?token|password)\\b\\s*[:=]\\s*['\"][^'\"]{8,}"
  - "AKIA[0-9A-Z]{16}"
  - "-----BEGIN [A-Z ]*PRIVATE KEY-----"

# Repo-relative globs where secret-pattern matches are KNOWN example/fixture
# tokens (never real credentials). Applies ONLY to the `secret` finding kind —
# marker / private-path / forbidden checks are never relaxed by this list. Each
# entry is verified to contain only placeholders or test inputs (no live keys).
# The canonical AWS docs example token `AKIAIOSFODNN7EXAMPLE` is additionally
# suppressed everywhere in code (src/lib/partition_integrity.py).
secret_allow_globs:
  # Skill test suites assert secret-scanning behavior with fixture credentials
  # (placeholder test keys, not live ones).
  - "project-brain/capabilities/skills/ai/augur/tests/**"
  - "project-brain/capabilities/skills/daemon/augur/tests/**"
  # routine-security tests plant a fake AWS key to assert secret-scanning still
  # fires on standard-core files (ADR-040 exemption test); placeholder, not live.
  - "project-brain/capabilities/skills/routine-security/augur/tests/**"
  # Archived ADR quotes the cloud-execution source snippet that contains the
  # missing-credential status label.
  - "project-brain/decisions/adrs/archive/2026-04-24-ai-client-cloud-execution.md"
  # Wiki doc shows an env-interpolation example with a placeholder var reference.
  - "project-brain/knowledge/wiki/concepts/gitagent-framework.md"
  # Source status-classifier label string — a literal label, not a credential.
  - "src/lib/ai/cloud_execution.py"
  # Dashboard unit/feature tests use mock OAuth/provider tokens (glama-key-123, ...).
  - "tests/dashboard/**"
  # The partition scanner's own test file exercises example tokens as fixtures.
  - "tests/test_partition_integrity.py"

# Top-level / internal directory names never scanned (denylist model). Any path
# containing one of these names as a component is skipped entirely.
exclude_dirs:
  - ".git"
  - "node_modules"
  - ".venv"
  - ".next"
  - "__pycache__"
  - "dist"
  - "build"
  - ".mypy_cache"
  - ".pytest_cache"

# Additional repo-relative glob exclusions.
exclude_globs:
  - "**/__pycache__/**"
  - "**/node_modules/**"
  - "**/.next/**"
  - "docs/superpowers/**"
  # NOTE: the AI-assistant workflows (claude/codex/gemini) + cron-nightly are
  # PUBLISHED (not excluded): tests validate their security posture (review-first,
  # read-only) so they must exist in the tree. codex/claude/cron-nightly are
  # comment/schedule-triggered (never run on a PR push); gemini.yml runs on
  # pull_request but its secret-using steps are gated on env.GEMINI_API_KEY so
  # they skip (job stays green) when the public repo lacks the secret.
