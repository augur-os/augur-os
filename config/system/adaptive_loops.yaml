# Adaptive Loop Engine Configuration
# Category definitions are decentralized in per-skill SKILL.md x-augur-loop frontmatter.
# This file contains engine-level settings only.
# See get_adr_dir()/ADR-176-adaptive-loop-engine.md

engine:
  enabled: true
  poll_interval_seconds: 300
  nightly_time: "03:00"
  max_concurrent_sessions: 1
  session_timeout_minutes: 30
  history_retention_days: 30
  verify_command: "cd apps/dashboard && npx tsc --noEmit"
  post_exec_queue: "state/adaptive/post_exec_queue.jsonl"
  shared_snapshot: true
  llm_escalation:
    enabled: true
    min_difficulty: 2
    min_trust: 0.3
    budget_multiplier: 3
    max_turns: 20
    timeout_s: 600
    allowed_tools: "Read,Edit,Bash,Grep,Glob,Write"

services:
  insight_scanner:
    # 2026-05-11: DISABLED ahead of the unified Background Routines refactor
    # (spec: docs/superpowers/specs/2026-05-11-background-routines-unified-design.md).
    # This scanner spawns ~39 Claude Code background sessions per fire — burning ~30% of
    # a 5h Claude budget per 12h cycle, with most output (~2,200 insights/2,219 backlogged
    # in state/daemon/insights/insights.yaml) never surfacing past max_notifications_per_day: 1.
    # Re-enable by restoring interval_hours: 12 once the dashboard exposes a per-routine
    # control surface, OR after auditing the value/cost ratio of the suggestions output.
    # 876000h = 100 years → effectively never-fire without removing the entry.
    # `enabled: false` makes the disabled state explicit in Browse (rendered as
    # "Disabled" rather than a misleading "every 100yr"); the daemon does not read it,
    # so the 876000h interval remains the actual execution guard.
    enabled: false
    interval_hours: 876000
  continuous_executor:
    poll_interval_seconds: 300
    backoff_multiplier: 2.0
    max_backoff_seconds: 1800
    max_budget_per_task: 5.0

loops:
  self-heal:
    budget: 12
    budget_growth_rate: 3

  code-quality:
    budget: 36
    budget_growth_rate: 4

  command-evolution:
    budget: 6
    budget_growth_rate: 3

  knowledge-enrichment:
    budget: 30
    budget_growth_rate: 3

  hardening:
    budget: 24
    budget_growth_rate: 4

  skill-standards:
    budget: 20
    budget_growth_rate: 4

  observability:
    budget: 20
    budget_growth_rate: 3

  testing:
    budget: 24
    budget_growth_rate: 4

  duplication:
    budget: 16
    budget_growth_rate: 4

  skill-quality:
    budget: 30
    budget_growth_rate: 3

  ui-quality:
    budget: 20
    budget_growth_rate: 4

  evals:
    budget: 12
