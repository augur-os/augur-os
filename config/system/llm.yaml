active_profile: local

profiles:
  local:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model: qwen3.5:latest
    timeout_s: 120
    disable_thinking: true
  remote:
    provider: openai_compatible
    base_url: https://glama.ai/api/gateway/openai/v1
    model: anthropic/claude-sonnet-4
    timeout_s: 60
    api_key_env: GLAMA_API_KEY
  vision-local:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model: llava-llama3
    timeout_s: 120
  local_fast:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model: qwen3:1.7b
    timeout_s: 120
    disable_thinking: true
  local_ocr:
    provider: openai_compatible
    base_url: http://localhost:11434/v1
    model: glm-ocr
    timeout_s: 120
  local_asr:
    provider: command
    base_url: local://openvino
    model: whisper-large-v3-int8-ov
    command: openvino-whisper
    timeout_s: 600

# Task routing — only override when a task needs a DIFFERENT profile than active_profile.
# Tasks not listed here use active_profile (currently 'default').
# When airplane mode is on, ALL tasks use 'local' regardless of this mapping.
# Document OCR cloud escalation is handled by passive CLI agents, not API keys.
tasks:
  document_ocr: local_ocr
  document_asr: local_asr
  document_title: local_fast
