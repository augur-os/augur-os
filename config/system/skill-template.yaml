# Canonical Skill Template Definition (ADR-270)
#
# Skill root must remain Claude Code skill-standard compliant after:
#   rm -rf augur/
#
# Root: standard-only content.
# augur/: Augur platform wiring only.

version: "3.0"

required_files:
  - SKILL.md

optional_files:
  - CHANGELOG.md
  - LICENSE
  - LICENSE.txt
  - .gitignore
  - plugin-spec.yaml
  - collateral.md
  - multi-repo.md
  - worktree.md
  - requirements.txt
  - pyproject.toml
  - uv.lock
  - package.json
  - package-lock.json

allowed_dirs:
  - augur
  - scripts
  - commands
  - references
  - examples
  - assets

banned:
  - README.md
  - dashboard.yaml
  - dashboard
  - api
  - mcp
  - data
  - lib
  - rag
  - tests
  - modules
  - config
  - adapters
  - hooks
  - chains
  - services
  - bundle
  - knowledge
  - schemas
  - data-template
  - _dev
  - docs
  - templates
  - ACCEPTANCE_CRITERIA.md
  - BACKLOG.md

augur_dir:
  allowed_dirs:
    - dashboard
    - api
    - lib
    - config
    - adapters
    - tests
    - modules

  allowed_files:
    - README.md
    - version.yaml

  fix_routes:
    mcp: scripts/mcp
    data: assets/seeds
    rag: delete
    hooks: delete
    chains: delete
    data-template: delete
    _dev: delete
    docs: references/docs
    templates: assets/templates
    schemas: augur/config/schemas
    services: augur/lib/services
    bundle: assets/bundle
    knowledge: references/knowledge
    dashboard.yaml: delete

  fix_unknown_dir: augur/lib
  fix_unknown_file: augur/lib

  dashboard:
    required_files:
      - tsconfig.json
    optional_files:
      - page.tsx
      - layout.tsx
      - loading.tsx
      - error.tsx
      - page.test.tsx
      - hooks.ts
      - types.ts
    allowed_extensions:
      - .tsx
      - .ts
      - .json
      - .css
      - .md
    allow_subdirs: true
    fix_binary_ext_to: assets

  api:
    required_files:
      - tsconfig.json
    allowed_extensions:
      - .ts
      - .json
    allow_subdirs: true
    fix_wrong_ext_to: augur/lib
    fix_binary_ext_to: assets

  lib:
    allowed_extensions:
      - .py
      - .ts
      - .tsx
      - .json
      - .yaml
      - .yml
      - .md
    allow_subdirs: true
    fix_binary_ext_to: assets

  config:
    allowed_extensions:
      - .yaml
      - .yml
      - .json
      - .toml
      - .md
    allow_subdirs: true
    fix_binary_ext_to: assets

  adapters:
    allowed_extensions:
      - .py
      - .ts
      - .tsx
      - .json
      - .yaml
      - .yml
      - .md
    allow_subdirs: true
    fix_binary_ext_to: assets

  tests:
    allowed_extensions:
      - .py
      - .ts
      - .tsx
      - .json
      - .yaml
      - .yml
      - .md
      - .snap
    allow_subdirs: true
    fix_binary_ext_to: assets

  modules:
    allowed_extensions:
      - .py
      - .ts
      - .tsx
      - .json
      - .yaml
      - .yml
      - .md
    allow_subdirs: true
    fix_binary_ext_to: assets

scripts_dir:
  allowed_extensions:
    - .py
    - .sh
    - .bash
    - .ps1
    - .swift
    - .applescript
    - .template
    - .ts
    - .js
    - .json
    - .yaml
    - .yml
    - .md
  allow_subdirs: true
  fix_binary_ext_to: assets
  mcp:
    required_files:
      - __init__.py
    allowed_extensions:
      - .py
      - .json
      - .yaml
      - .yml
      - .md
    allow_subdirs: true
    fix_binary_ext_to: assets

references_dir:
  allowed_extensions:
    - .md
    - .txt
    - .json
    - .yaml
    - .yml
    - .pdf
  allow_subdirs: true
  fix_binary_ext_to: assets

examples_dir:
  allowed_extensions:
    - .md
    - .txt
    - .json
    - .yaml
    - .yml
    - .py
    - .ts
    - .tsx
    - .sh
  allow_subdirs: true
  fix_binary_ext_to: assets

assets_dir:
  allowed_extensions:
    - .png
    - .jpg
    - .jpeg
    - .gif
    - .svg
    - .ico
    - .webp
    - .mp4
    - .mp3
    - .wav
    - .m4a
    - .webm
    - .pdf
    - .docx
    - .xlsx
    - .pptx
    - .zip
    - .tar.gz
    - .html
    - .css
    - .php
    - .ts
    - .tsx
    - .js
    - .jsx
    - .json
    - .yaml
    - .yml
    - .py
    - .md
    - .txt
    - .gitignore
    - .app
    - .plist
    - .icns
    - .template
    - .tmpl
  allow_subdirs: true
  allow_no_extension: true
  fix_disallowed: delete

skillmd:
  required_fields:
    - name
    - description
    - x-augur-type
  valid_types:
    - domain
    - library-reference
    - runbook
    - autoloop
    - command
    - template
    - meta
  optional_fields:
    - version
    - license
    - metadata
    - x-augur-tags
    - x-augur-loop
    - x-augur-dependencies
    - x-augur-commands
    - x-augur-mcp-tools
  banned_fields: []
  metadata_fields:
    - version
    - author
    - mcp-server
    - isolation
    - hooks
