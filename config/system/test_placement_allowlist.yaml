# ADR-762: tests under central tests/ that legitimately need to know vault-tier
# or staged-tier skill names. Boundary / architecture / infrastructure tests
# whose entire purpose is to validate the segregation. Extending this list
# requires a code review — the allowlist exists so the boundary is explicit,
# not silent.
#
# Entries are repo-relative POSIX paths. The guard at
# scripts/check_skill_test_placement.py reads this file and exempts listed
# entries from the filename + body-import checks.

allowed_central_tests_with_skill_refs:
  # Architecture guard: verifies src/ has NO vault-tier skill name refs.
  # Must know the vault-tier names to test for their absence.
  - tests/architecture/test_no_vault_skill_refs.py

  # MCP shared config-path resolution: uses skill names (career-ops,
  # file-manager, websites) as example inputs to a path-resolution test.
  - tests/mcp/test_shared_config_paths.py

  # MCP CLI configuration: treats augur-{lifestyle, file-manager, obsidian}
  # as configurable MCP server names. Repo-level concern.
  - tests/scripts/test_configure_mcp_cli.py

  # Dynamic plugin loader: comment-only reference to vault-tier names
  # explaining why certain plugins are excluded from the monolith loader.
  - tests/packages/augur-mcp/tools/test_dynamic_plugin_loader.py

  # Tests of the staged-skill catalog mechanism itself.

  # Tests of the staging-to-vault-drafts migration script.
  - tests/src/test_migrate_staging_to_vault_drafts.py

  # Skill-agnostic bundle_server smoke test (replaced
  # test_bundle_server_file_manager.py, see ADR-762 status notes). Parameterized
  # over any available vault skill via AUGUR_BUNDLE_SERVER_TEST_SKILL env var.
  - tests/cli/test_bundle_server_per_skill_smoke.py

  # Skill-paths logic test: uses staged/vault skill names as data inputs.
  - tests/test_skill_paths.py

  # Capability-policy tests that enumerate skill ownership across the registry.
  - tests/lib/test_capability_browse_enrichment.py
  - tests/lib/test_capability_inventory_discovery.py

  # Cluster A dashboard tests: skill-name strings appear only in comments that
  # document the sys.modules namespacing decision (project-augur-mcp-shim memory).
  - tests/dashboard/python/test_mcp.py
  - tests/dashboard/python/test_normalizer.py

  # Architecture test: scans MULTIPLE skills' source files for vault-pollution
  # patterns. Inherently cross-cutting; repo-level.

  # The guard's own unit test: uses skill-script paths as test FIXTURE strings.
  - tests/scripts/test_check_skill_test_placement.py

  # Sync-agent global identity boundary test: repo-level because it verifies
  # shared MCP/client config behavior across configure_mcp and sync adapters.
  - tests/sync_agents/test_global_identity_sync.py

  # Worktree preflight test: tests scripts/worktree_preflight.py (repo-level)
  # and subprocess-invokes platform-admin/scripts/worktree_guard.py for integration
  # coverage. Test belongs at repo level alongside the script under test.
  - tests/scripts/test_worktree_preflight.py

  # Release-tree guard: ensures public docs do not point users at skill-internal
  # document-extractor scripts. Repo-level release policy, not a skill test.
  - tests/scripts/test_build_public_release_tree.py

  # Core vault operation tests: uses a rag script path as metadata fixture data
  # for save-synthesis behavior. Repo-level MCP core test, not a rag test.
  - tests/packages/augur-mcp/core/test_vault_ops.py

  # Indexer dedup smoke test: the sync_agents path appears only as a fixture
  # string constant (SYNC_AGENTS_MARKER) to simulate a generated-file header —
  # it is not an import of ai/scripts skill code. Repo-level indexer test.
  - tests/lib/index/test_skill_index_dedupe.py
