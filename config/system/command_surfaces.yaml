version: 1

surfaces:
  xa:
    description: Launch Codex after choosing main or new worktree; use --desktop to open Codex Desktop for browser-capable sessions; can also resume a dashboard handoff with --handoff-file.
    platforms: [windows, posix]
    canonical_engine:
      type: python
      module: src.scripts.agent_launch
      mode: codex
    adapters:
      windows: scripts/xa-launch.ps1
      posix: scripts/xa-launch.sh
    installers:
      windows: scripts/install.ps1
      posix: scripts/install.sh
    tests:
      - tests/scripts/test_agent_launch_core.py
      - tests/scripts/test_xa_launch.py
      - tests/scripts/test_launcher_adapters_windows.py
      - tests/scripts/test_launcher_adapters_posix.py
      - tests/scripts/test_install_alias_block.py
  ca:
    description: Launch Claude after choosing main or new worktree; can also resume a dashboard handoff with --handoff-file.
    platforms: [windows, posix]
    canonical_engine:
      type: python
      module: src.scripts.agent_launch
      mode: claude
    adapters:
      windows: scripts/ca-launch.ps1
      posix: scripts/ca-launch.sh
    installers:
      windows: scripts/install.ps1
      posix: scripts/install.sh
    tests:
      - tests/scripts/test_agent_launch_core.py
      - tests/scripts/test_ca_launch.py
      - tests/scripts/test_launcher_adapters_windows.py
      - tests/scripts/test_launcher_adapters_posix.py
      - tests/scripts/test_install_alias_block.py
  ga:
    description: Launch Gemini after choosing main or new worktree; can also resume a dashboard handoff with --handoff-file.
    platforms: [windows, posix]
    canonical_engine:
      type: python
      module: src.scripts.agent_launch
      mode: gemini
    adapters:
      windows: scripts/ga-launch.ps1
      posix: scripts/ga-launch.sh
    installers:
      windows: scripts/install.ps1
      posix: scripts/install.sh
    tests:
      - tests/scripts/test_agent_launch_core.py
      - tests/scripts/test_ga_launch.py
      - tests/scripts/test_launcher_adapters_windows.py
      - tests/scripts/test_launcher_adapters_posix.py
      - tests/scripts/test_install_alias_block.py
  gca:
    description: Launch GitHub Copilot CLI after choosing main or new worktree; can also resume a dashboard handoff with --handoff-file.
    platforms: [windows, posix]
    canonical_engine:
      type: python
      module: src.scripts.agent_launch
      mode: copilot
    adapters:
      windows: scripts/gca-launch.ps1
      posix: scripts/gca-launch.sh
    installers:
      windows: scripts/install.ps1
      posix: scripts/install.sh
    tests:
      - tests/scripts/test_agent_launch_core.py
      - tests/scripts/test_gca_launch.py
      - tests/scripts/test_launcher_adapters_windows.py
      - tests/scripts/test_launcher_adapters_posix.py
      - tests/scripts/test_install_alias_block.py
  dev:
    description: Agent- and human-callable dashboard build/restart (build verb) via the shared dev_build engine.
    platforms: [posix]
    canonical_engine:
      type: python
      module: src.lib.dev_build
      mode: build
    tests:
      - tests/unit/test_dev_build_resolve.py
      - tests/unit/test_dev_build_engine.py
      - tests/unit/test_cli_dev_build.py
      - project-brain/capabilities/skills/daemon/augur/tests/test_scoped_restart.py
  rag:
    description: Headless RAG index sync and freshness status via the incremental sync engine; same engine serves the watcher daemon, MCP rag-sync, and /ask reindex.
    platforms: [posix]
    canonical_engine:
      type: python
      module: src.lib.index.incremental
      mode: sync
    tests:
      - tests/lib/index/test_incremental_sync.py
      - tests/lib/index/test_sync_lock.py
  onboard:
    description: Cross-OS onboard engine — installs deps, builds the dashboard, wires MCP, seeds a brain, and verifies. Detect+guide for missing prereqs.
    platforms: [windows, posix]
    canonical_engine:
      type: python
      module: src.cli_onboard
    adapters:
      windows: scripts/onboard.ps1
      posix: scripts/onboard.sh
    tests:
      - tests/onboard/test_cli_onboard.py
      - tests/onboard/test_driver.py

shell_inventory:
  declared_posix_only:
    - path: .githooks/dashboard-shortcut-staged-scan.sh
      reason: Git hook scanner runs in a POSIX shell hook environment.
    - path: .githooks/browse-rule-32-scan.sh
      reason: Git hook scanner runs in a POSIX shell hook environment.
    - path: .githooks/global-identity-staged-scan.sh
      reason: Git hook scanner runs in a POSIX shell hook environment.
    - path: .github/scripts/ci_check.sh
      reason: POSIX CI helper; Windows CI uses native workflow steps.
    - path: apps/dashboard/scripts/build.sh
      reason: POSIX dashboard helper; Windows uses dashboard slash-command workflow.
    - path: apps/dashboard/scripts/start-dev.sh
      reason: POSIX dashboard helper; Windows uses dashboard slash-command workflow.
    - path: scripts/ai-launch.sh
      reason: POSIX legacy launcher retained until the Python engine migration removes direct use.
    - path: scripts/demo-mode.sh
      reason: POSIX demo helper.
    - path: scripts/disk-cleanup/cleanup.sh
      reason: POSIX disk-cleanup helper.
    - path: scripts/disk-cleanup/scan.sh
      reason: POSIX disk-cleanup helper.
    - path: scripts/hooks/dashboard-shortcut-patterns.sh
      reason: POSIX shell pattern fragment sourced by hook scripts.
    - path: scripts/install.sh
      reason: POSIX installer bootstrap; Windows installer is scripts/install.ps1.
    - path: scripts/nightly_pipeline.sh
      reason: POSIX scheduled helper.
    - path: scripts/release.sh
      reason: POSIX release helper.
    - path: scripts/run-chain.sh
      reason: POSIX workflow helper.
    - path: scripts/worktree-launch.sh
      reason: POSIX legacy worktree launcher retained until the Python engine migration removes direct use.
    - path: project-brain/capabilities/skills/platform-admin/scripts/cleanup_env.sh
      reason: zsh cleanup helper for POSIX environments.
    - path: project-brain/capabilities/skills/platform-admin/scripts/github-release-auto.sh
      reason: POSIX GitHub release helper.
    - path: src/scripts/emit_heal_event.sh
      reason: POSIX heal-event helper.
  declared_internal:
    - path: .githooks/commit-msg
      reason: Git hook helper executed by a POSIX shell hook environment.
    - path: .githooks/post-checkout
      reason: Git hook helper executed by a POSIX shell hook environment.
    - path: .githooks/post-commit
      reason: Git hook helper executed by a POSIX shell hook environment.
    - path: .githooks/post-merge
      reason: Git hook helper executed by a POSIX shell hook environment.
    - path: .githooks/pre-commit
      reason: Git hook helper executed by a POSIX shell hook environment.
    - path: .githooks/pre-push
      reason: Git hook helper executed by a POSIX shell hook environment.
    - path: apps/dashboard/scripts/build-lock.sh
      reason: Python script with .sh legacy filename; tracked here until a follow-up rename.
    - path: scripts/aug
      reason: Extensionless POSIX CLI launcher; cross-platform migration is outside this launcher pass.
    - path: scripts/augur
      reason: Extensionless POSIX entrypoint; cross-platform migration is outside this launcher pass.
    - path: scripts/augur-codex-mcp
      reason: Extensionless POSIX MCP launcher; Windows Codex config uses scripts/augur-codex-mcp.ps1.
    - path: scripts/augur-mcp
      reason: Extensionless POSIX MCP launcher; cross-platform migration is outside this launcher pass.
    - path: scripts/hooks/post-commit-index
      reason: Git hook helper executed by a POSIX shell hook environment.
