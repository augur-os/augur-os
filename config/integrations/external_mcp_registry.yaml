version: 2
services:
  # === MCP Servers ===
  context7:
    name: Context7
    type: mcp
    description: Up-to-date library documentation and code examples
    tier: 1
    cost: free
    enabled: true
    command: npx
    args:
    - -y
    - '@upstash/context7-mcp'
    env: {}
    env_required: []
    used_by:
    - knowledge
    - developer
    - frontend
    setup_url: https://github.com/upstash/context7
    tags:
    - docs
    - library
    - documentation
  github:
    name: GitHub MCP
    type: mcp
    description: GitHub repository operations via MCP
    tier: 2
    cost: free
    enabled: false
    command: npx
    args:
    - -y
    - '@modelcontextprotocol/server-github'
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
    env_required:
    - name: GITHUB_PERSONAL_ACCESS_TOKEN
      description: GitHub PAT with repo scope
    used_by:
    - developer
    - platform-admin
    setup_url: https://github.com/modelcontextprotocol/servers/tree/main/src/github
    tags:
    - github
    - git
    - repository
  brightdata:
    name: Bright Data MCP
    type: mcp
    description: Web scraping and data collection via Bright Data proxies
    tier: 2
    cost: existing
    enabled: false
    command: npx
    args:
    - -y
    - '@anthropics/brightdata-mcp'
    env:
      API_TOKEN: ${BRIGHTDATA_API_KEY}
    env_required:
    - name: BRIGHTDATA_API_KEY
      description: Bright Data API key
    used_by:
    - career
    - install
    setup_url: https://docs.brightdata.com/
    tags:
    - scraping
    - proxy
    - web
    - linkedin
  exa:
    name: Exa Search
    type: mcp
    description: AI-native search engine for finding similar content
    tier: 3
    cost: paid
    enabled: false
    command: npx
    args:
    - -y
    - '@anthropics/exa-mcp'
    env:
      EXA_API_KEY: ${EXA_API_KEY}
    env_required:
    - name: EXA_API_KEY
      description: Exa API key
    used_by:
    - install
    - knowledge
    setup_url: https://exa.ai/
    tags:
    - search
    - semantic
  firecrawl:
    name: Firecrawl
    type: mcp
    description: Web page crawling and content extraction
    tier: 3
    cost: paid
    enabled: false
    command: npx
    args:
    - -y
    - firecrawl-mcp
    env:
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
    env_required:
    - name: FIRECRAWL_API_KEY
      description: Firecrawl API key
    used_by:
    - scraper
    - install
    setup_url: https://firecrawl.dev/
    tags:
    - crawling
    - extraction
    - web
  brave-search:
    name: Brave Search
    type: mcp
    description: Privacy-focused web search
    tier: 3
    cost: free
    enabled: false
    command: npx
    args:
    - -y
    - '@anthropics/brave-search-mcp'
    env:
      BRAVE_API_KEY: ${BRAVE_API_KEY}
    env_required:
    - name: BRAVE_API_KEY
      description: Brave Search API key
    used_by:
    - install
    - knowledge
    setup_url: https://brave.com/search/api/
    tags:
    - search
    - web
    - privacy

  # === CLI Tools ===
  gh:
    name: GitHub CLI
    type: cli
    description: GitHub CLI for repository and issue management
    tier: 1
    cost: free
    enabled: true
    check_command: gh --version
    used_by:
    - career
    - developer
    - platform-admin
    - skillstore
    setup_url: https://cli.github.com/
    tags:
    - github
    - cli
    - git
  gcloud:
    name: Google Cloud CLI
    type: cli
    description: Google Cloud SDK for workspace and API access
    tier: 2
    cost: free
    enabled: false
    check_command: gcloud version
    used_by:
    - google-workspace
    setup_url: https://cloud.google.com/sdk/docs/install
    tags:
    - google
    - cloud
    - cli
  skills-sh:
    name: Skills.sh CLI
    type: cli
    description: Open agent skills ecosystem — search, install, manage community skills
    tier: 1
    cost: free
    enabled: true
    check_command: npx skills --version
    used_by:
    - skillstore
    - import
    - ai
    setup_url: https://skills.sh
    tags:
    - skills
    - community
    - marketplace
