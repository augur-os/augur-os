version: 1
hooks:
  PreToolUse:
  - name: secrets-guard
    matcher: Write|Edit
    handler: "if echo \"$HOOK_FILE_PATH\" | grep -qE '\\.(env|pem|key|secrets?)$';\
      \ then\n  echo \"Blocked: Cannot write to sensitive file: $HOOK_FILE_PATH\"\n\
      \  exit 1\nfi\n"
    mode: command
    priority: 10
    enabled: true
  - name: root-write-guard
    matcher: Write|Edit
    handler: |
      REPO_ROOT=$(git rev-parse --show-toplevel 2>/dev/null || pwd)
      export REPO_ROOT
      python3 - <<'PY'
      import os
      import sys
      from pathlib import Path

      repo_root = Path(os.environ["REPO_ROOT"]).resolve()
      file_path = Path(os.environ["HOOK_FILE_PATH"]).resolve()

      try:
          rel = file_path.relative_to(repo_root)
      except ValueError:
          raise SystemExit(0)

      if len(rel.parts) != 1:
          raise SystemExit(0)

      sys.path.insert(0, str(repo_root))
      from src.lib.repo_hygiene import is_allowed_root_item

      if is_allowed_root_item(rel.name):
          raise SystemExit(0)

      print(f"Blocked: repo-root writes must use canonical files only: {rel.name}")
      raise SystemExit(1)
      PY
    mode: command
    priority: 15
    enabled: true
  - name: dangerous-command-guard
    matcher: Bash
    handler: "if echo \"$HOOK_TOOL_INPUT\" | grep -qE '(rm -rf|sudo|chmod 777|curl.*\\\
      |.*sh)'; then\n  echo \"Warning: Potentially dangerous command detected\"\n\
      \  exit 1\nfi\n"
    mode: command
    priority: 20
    enabled: false
  PostToolUse:
  - name: auto-lint
    matcher: Write|Edit
    condition: path.endswith('.py') or path.endswith('.ts') or path.endswith('.tsx')
    handler: 'echo "File modified: $HOOK_FILE_PATH"

      # Add linting command here when ready

      # python3 -m ruff check "$HOOK_FILE_PATH" --fix

      '
    mode: prompt
    priority: 100
    enabled: false
  - name: tool-telemetry
    handler: 'echo "$(date -Iseconds) | $HOOK_EVENT | $HOOK_TOOL | $HOOK_FILE_PATH"
      >> /tmp/exo-hook-telemetry.log

      '
    mode: prompt
    priority: 1000
    enabled: false
  SessionStart:
  - name: context-loader
    handler: 'echo "Session started"

      # Could preload repo context here if a dedicated bootstrap step is needed

      '
    mode: prompt
    priority: 100
    enabled: false
  SessionEnd:
  - name: wiki-session-update-flag
    handler: node scripts/hooks/run-hook.mjs session-wiki-flag
    mode: command
    priority: 90
    enabled: true
  Stop:
  - name: checkpoint-saver
    handler: 'echo "Session ending - saving checkpoint"

      # Could save session state here

      '
    mode: command
    priority: 100
    enabled: false
  UserPromptSubmit:
  - name: intent-hardening
    condition: len(prompt) > 500
    handler: 'echo "Long prompt detected (${#HOOK_PROMPT} chars) - consider breaking
      into smaller tasks"

      '
    mode: prompt
    priority: 100
    enabled: false
schema_version: 1
