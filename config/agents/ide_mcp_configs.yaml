ides:
  claude_desktop:
    enabled: true
    display_name: Claude Desktop
    config_format: json
    config_structure: flat
    config_path:
      darwin: ~/Library/Application Support/Claude/claude_desktop_config.json
      linux: ~/.config/Claude/claude_desktop_config.json
      windows: '%APPDATA%/Claude/claude_desktop_config.json'
    server_key: mcpServers
    cli_arg: --claude-config
    notes: Anthropic's desktop app
    # Home-config-only client: Claude Desktop/Cowork loads MCP servers ONLY from
    # this config (no repo-local .mcp.json path), so project-scoped Augur servers
    # (augur-core/augur-framework) must be emitted here. Without this, configure_mcp
    # would perpetually flag them as drift against the adapter that writes them
    # (ADR-783 scope-split exception; see config/system/mcp_servers.yaml).
    include_project_scoped: true
  claude_code:
    enabled: true
    display_name: Claude Code CLI
    config_format: json
    config_structure: per_project
    config_path:
      all: ~/.claude.json
    server_key: mcpServers
    cli_arg: --claude-code-config
    notes: Anthropic's CLI tool - uses per-project config under 'projects' key
  cursor:
    enabled: true
    display_name: Cursor IDE
    config_format: json
    config_structure: flat
    config_path:
      darwin: ~/Library/Application Support/Cursor/User/globalStorage/cursor.mcp/mcp.json
      linux: ~/.config/Cursor/User/globalStorage/cursor.mcp/mcp.json
      windows: '%APPDATA%/Cursor/User/globalStorage/cursor.mcp/mcp.json'
    server_key: mcpServers
    cli_arg: --cursor-config
    notes: Cursor IDE with MCP support
  windsurf:
    enabled: true
    display_name: Windsurf IDE
    config_format: json
    config_structure: flat
    config_path:
      darwin: ~/.codeium/windsurf/mcp_config.json
      linux: ~/.codeium/windsurf/mcp_config.json
      windows: '%USERPROFILE%/.codeium/windsurf/mcp_config.json'
    server_key: mcpServers
    cli_arg: --windsurf-config
    notes: Codeium's Windsurf IDE
  codex_cli:
    enabled: true
    display_name: Codex CLI
    config_format: toml
    config_structure: flat
    config_path:
      all: ~/.codex/config.toml
    server_key: mcp_servers
    cli_arg: --codex-config
    notes: OpenAI's Codex CLI tool
    # Home-config-only client (no repo-local .mcp.json) — keep project-scoped
    # Augur servers here. See claude_desktop above.
    include_project_scoped: true
  copilot_cli:
    enabled: true
    display_name: GitHub Copilot CLI
    config_format: json
    config_structure: flat
    config_path:
      all: ~/.copilot/mcp-config.json
    server_key: mcpServers
    cli_arg: --copilot-config
    notes: GitHub Copilot CLI MCP config
  vscode_copilot:
    enabled: true
    display_name: VS Code Copilot
    config_format: json
    config_structure: flat
    config_path:
      all: '{repo_root}/.vscode/mcp.json'
    server_key: servers
    cli_arg: --vscode-copilot-config
    notes: Workspace MCP config consumed by VS Code Copilot
  opencode:
    enabled: true
    display_name: OpenCode
    config_format: json
    config_structure: flat
    config_path:
      all: ~/.config/opencode/opencode.json
    server_key: mcp
    cli_arg: --opencode-config
    notes: OpenCode agent config using opencode.json
    # Home-config-only client (no repo-local .mcp.json) — keep project-scoped
    # Augur servers here. See claude_desktop above.
    include_project_scoped: true
  gemini:
    enabled: true
    display_name: Gemini CLI
    config_format: json
    config_structure: flat
    config_path:
      all: ~/.gemini/settings.json
    server_key: mcpServers
    cli_arg: --gemini-config
    notes: Gemini CLI tool
  antigravity:
    enabled: true
    display_name: Antigravity
    config_format: json
    config_structure: flat
    config_path:
      all: ~/.gemini/antigravity/mcp_config.json
    server_key: mcpServers
    cli_arg: --antigravity-config
    notes: Gemini-based agent
    # Home-config-only client (no repo-local .mcp.json) — keep project-scoped
    # Augur servers here. See claude_desktop above.
    include_project_scoped: true
  cline:
    enabled: true
    display_name: Cline
    config_format: json
    config_structure: flat
    config_path:
      darwin: ~/Library/Application Support/Cline/mcp.json
      linux: ~/.config/Cline/mcp.json
      windows: '%APPDATA%/Cline/mcp.json'
    server_key: mcpServers
    cli_arg: --cline-config
    notes: Cline IDE with MCP support
  perplexity:
    enabled: true
    display_name: Perplexity
    config_format: dxt
    config_structure: flat
    config_path:
      darwin: ~/Library/Containers/ai.perplexity.mac/Data/Documents/connectors/dxt/installed
    dxt_id: augur%2Faugur-mcp
    cli_arg: --perplexity-config
    notes: Perplexity AI app (macOS) — DXT connector format. Auto-installs manifest.json into Perplexity container.
    # Home-config-only client: the DXT connector is the only load path, so it
    # needs the project-scoped Augur server (augur-framework) resolved. Without
    # this the entry set is empty and the DXT branch has nothing to install.
    # See claude_desktop above.
    include_project_scoped: true
  generic:
    enabled: true
    display_name: Generic MCP Config
    config_format: json
    config_structure: flat
    config_path:
      all: '{repo_root}/config/mcp_config.json'
    server_key: mcpServers
    cli_arg: --mcp-config
    notes: Repo-local config for any MCP-compatible tool
schema_version: 1
