# CLI Headless Invocation Profiles
#
# Defines how to invoke each CLI tool non-interactively.
# Used by build_headless_cmd() in src/lib/llm_retry.py.
#
# To add a new client: add a profile entry here. No code changes needed.
#
# Schema:
#   subcommand:       Subcommand inserted after the binary (e.g. "exec", "run")
#   output_mode:      Flag that makes the CLI output non-interactively (e.g. "--print")
#   prompt_delivery:  "flag" = uses prompt_flag before prompt text
#                     "positional" = prompt is the last positional argument
#   prompt_flag:      The flag before the prompt text (only used when prompt_delivery=flag)
#   param_flags:      Map of semantic parameter names to CLI flag strings
#     model:          Flag for selecting the model
#     max_turns:      Flag for limiting agent turns/steps
#     allowed_tools:  Flag for restricting available tools
#   boolean_flags:    Map of semantic toggle names to CLI flag strings
#     bypass_approvals: Skip all confirmation prompts
#     no_session:       Don't persist session state

profiles:
  # ── Claude Code ──────────────────────────────────────────────────────────
  # claude --print --model MODEL --max-turns N -p "prompt"
  claude:
    output_mode: "--print"
    prompt_delivery: flag
    prompt_flag: "-p"
    param_flags:
      model: "--model"
      max_turns: "--max-turns"
      allowed_tools: "--allowedTools"
      additional_dirs: "--add-dir"
    boolean_flags:
      bypass_approvals: "--dangerously-skip-permissions"
      no_session: "--no-session-persistence"

  # ── Codex CLI ────────────────────────────────────────────────────────────
  # codex exec -m MODEL --ephemeral "prompt"
  codex:
    subcommand: "exec"
    prompt_delivery: positional
    param_flags:
      model: "-m"
    boolean_flags:
      bypass_approvals: "--dangerously-bypass-approvals-and-sandbox"
      no_session: "--ephemeral"

  # ── Kimi CLI ─────────────────────────────────────────────────────────────
  # kimi --print -m MODEL --max-steps-per-turn N --yolo -p "prompt"
  kimi:
    output_mode: "--print"
    prompt_delivery: flag
    prompt_flag: "-p"
    param_flags:
      model: "-m"
      max_turns: "--max-steps-per-turn"
    boolean_flags:
      bypass_approvals: "--yolo"

  # ── OpenCode ─────────────────────────────────────────────────────────────
  # opencode run -m MODEL "prompt"
  opencode:
    subcommand: "run"
    prompt_delivery: positional
    param_flags:
      model: "-m"
    boolean_flags: {}

  # ── Gemini CLI ───────────────────────────────────────────────────────────
  # gemini -m MODEL --yolo -p "prompt"
  gemini:
    prompt_delivery: flag
    prompt_flag: "-p"
    param_flags:
      model: "-m"
    boolean_flags:
      bypass_approvals: "--yolo"

  # ── Cursor Agent ─────────────────────────────────────────────────────────
  # cursor-agent --print --model MODEL --approve-mcps "prompt"
  cursor-agent:
    output_mode: "--print"
    prompt_delivery: positional
    param_flags:
      model: "--model"
    boolean_flags:
      bypass_approvals: "--approve-mcps"

  # ── GitHub Copilot CLI ──────────────────────────────────────────────────
  # copilot --model MODEL --allow-all -p "prompt"
  copilot:
    prompt_delivery: flag
    prompt_flag: "-p"
    param_flags:
      model: "--model"
    boolean_flags:
      bypass_approvals: "--allow-all"
