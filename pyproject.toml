[project]
name = "augur-cli"
version = "0.2.0"
description = "Agent-native CLI for the Augur personal knowledge system"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Gur Sannikov" }
]
keywords = ["augur", "mcp", "cli", "automation", "knowledge"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "augur-mcp",
    "pyyaml>=6.0",
    "mcp>=1.22.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.25.0",
    "trafilatura>=1.6",
    "beautifulsoup4>=4.12",
    "requests>=2.33.0",
    "aiohttp>=3.14.0",
    "toml>=0.10.2",
    "python-dotenv>=1.0.0",
    "watchdog>=6.0.0",
    "send2trash>=1.8.0",
    "markitdown[all]>=0.1.0",
    "pymupdf>=1.24.0",
    "rank-bm25>=0.2.2",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "networkx>=3.0",
    "jinja2>=3.1.0",
    "reportlab>=4.0",
    "tomli-w>=1.2.0",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
audio = [
    "pywhispercpp>=1.2.0",
]
diarization = [
    # Pinned to the 3.x line: the ported pyannote config (version 3.1.0) and the
    # compat monkey-patches in diarize.py are validated against pyannote 3.x.
    # pyannote 4.x changed model loading and the pipeline config schema.
    "pyannote.audio>=3.3.2,<4",
    # torch/torchaudio on the 2.8.x line. pyannote.audio 3.3.2 itself only requires
    # torch>=2.0 / torchaudio>=2.2 (no upper bound); torch>=2.6 clears the critical
    # CVE (vulnerable <2.6.0). The real ceiling is torchaudio>=2.9, which removed the
    # top-level ``torchaudio.AudioMetaData`` symbol that pyannote 3.x imports against
    # (breaks `from pyannote.audio import Pipeline`) — so cap <2.9. diarize.py already
    # carries the torch>=2.6 compat patches (torch.load weights_only=False, speechbrain
    # LazyModule stub). numpy cap dropped: torch>=2.6 is built against the numpy 2.x ABI.
    "torch>=2.6,<2.9",
    "torchaudio>=2.6,<2.9",
    "huggingface-hub>=0.36.0",
]
ocr = [
    "easyocr",
]
ai-pc-demo = [
    "openvino>=2026.0",
    "openvino-genai>=2026.0",
    "faster-whisper>=1.1.0",
    "huggingface-hub>=0.36.0",
    "imageio-ffmpeg>=0.5.1",
    "ctranslate2>=4.6.0",
    "pdf2image>=1.17.0",
    "opencv-python>=4.10.0.84",
]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "bandit>=1.7.0",
    "detect-secrets>=1.4",
    "pip-audit>=2.7.0",
]
windows = [
    "pyttsx3>=2.90",
]

[project.urls]
Homepage = "https://augur.run"
Repository = "https://github.com/augur-os/augur-os"
Documentation = "https://augur.run/more.html"
Issues = "https://github.com/augur-os/augur-os/issues"

[project.scripts]
aug = "src.cli:main"

[project.entry-points."augur.plugins"]
# Future: plugin discovery via entry points

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
# Only include CLI and MCP package — NOT plugins/, config/, or dashboard/
exclude = ["apps/dashboard", "src/scripts"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/pyproject.toml",
    "/README.md",
]

[tool.black]
line-length = 120
skip-string-normalization = true

[tool.ruff.lint]
exclude = [
    ".venv",
    "__pycache__",
    "node_modules",
    "apps/dashboard",
]
ignore = ["E402"]

[tool.pytest.ini_options]
norecursedirs = ["_dev", ".git", ".tox", ".venv", "modules", "node_modules"]
testpaths = ["tests", "plugins"]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "asyncio: mark test as async (automatically applied by pytest-asyncio)",
    "contract: MCP tool contract tests (verify input/output schemas)",
    "e2e: End-to-end workflow tests",
    "slow: Tests that take >5s to run",
    "requires_ripgrep: Tests requiring ripgrep CLI",
    "integration: Live integration tests requiring external CLIs installed",
]
pythonpath = [".", "project-brain/capabilities"]

[tool.mypy]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true

[tool.coverage.run]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.bandit]
exclude_dirs = [
    "tests",
    "node_modules",
    ".venv",
    "_dev",
]
skips = ["B110", "B112", "B105", "B311", "B404", "B603", "B607", "B101"]

[tool.uv.sources]
augur-mcp = { path = "src/mcp", editable = true }

[tool.uv]
# Security floors for transitive deps (Dependabot alerts). Keep sorted.
constraint-dependencies = [
    "aiohttp>=3.14.1",
    "cryptography>=48.0.1",
    "msgpack>=1.2.1",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.31",
    "starlette>=1.3.1",
    # NOTE: torch is intentionally NOT floored here — augur-cli[diarization] hard-pins
    # torch/torchaudio to the 2.2.x line for pyannote.audio 3.x compatibility (see the
    # diarization extra above). The torch CVEs (incl. the critical) require a pyannote
    # 3->4 + torchaudio + numpy 1->2 upgrade, which is a separate, deliberate decision.
]

[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.15.10",
]
