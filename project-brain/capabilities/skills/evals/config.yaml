# Eval harness configuration — ADR-742
#
# Loop alert thresholds for /loop-evals. The nightly loop computes a delta vs.
# the baseline symlink (or the most recent prior run) and emits a WARN alert
# event when any metric drops by MORE than its configured absolute threshold.
#
# v1 is report-only: the loop result stays GREEN regardless of alert severity.
# Thresholds are absolute points on the metric's 0..1 scale expressed in
# percentage points (e.g. 5.0 means a 0.05 absolute drop).

alert_thresholds:
  P_at_5: 5.0
  R_at_5: 5.0
  MRR: 5.0
  nDCG_at_10: 5.0

# Bootstrap resample count for the 95% confidence interval. Paid only on the
# baseline run and the nightly loop summary, never on an ad-hoc replay.
bootstrap_resamples: 1000

# Tools the capture observer watches. A tool name not in this list is never
# captured, regardless of contributor mode / consent.
capture_allowlist:
  - unified-search
  - knowledge-project-index-search
