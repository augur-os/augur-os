[project]
name = "setup-manager"
version = "0.1.0"
description = "Skill for managing the setup, discovery, and maintenance of Claude Skills."
readme = "SKILL.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "pyyaml>=6.0",
    "toml>=0.10.2",
    "packaging>=23.0"
]

# Note: CLI entrypoint removed - use analyzers programmatically via:
# from services.setup_manager import DataAnalyzer, DocAnalyzer, TestAnalyzer

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["augur/modules/services/setup_manager"]
