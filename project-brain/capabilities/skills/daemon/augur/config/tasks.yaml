# Unified Task Registry
# All scheduled and triggerable tasks are defined here.
# See ADR-010 for architecture details.
# Note: Plugin scripts have been migrated to augur-data repo
#
# Usage:
#   - Launchd runs task_runner.py --scheduled at 3am daily
#   - Manual: make task TASK=scrape-competitors
#   - CLI: exo run-task scrape-competitors
#   - All due: exo run-tasks --all

version: "1.0"
updated: "2026-01-20"

tasks:
  # ============================================
  # NIGHTLY MAINTENANCE (Daily at 3am)
  # ============================================
  nightly-maintenance:
    description: "Log rotation, analytics generation, backlog ingestion"
    script: project-brain/capabilities/skills/daemon/scripts/nightly_maintainer.py
    schedule: daily
    hour: 3
    minute: 0
    enabled: true
    timeout_seconds: 600
    on_failure: notify
    category: operations
    last_run: null
    next_run: null

  wiki-batched-daily:
    description: "Daily batched wiki update with priority tiers and skip-if-unchanged guard"
    script: project-brain/capabilities/skills/ingest/scripts/run_wiki_batched_daily.py
    schedule: daily
    hour: 6
    minute: 23
    enabled: true
    timeout_seconds: 900
    on_failure: notify
    category: ingest
    last_run: null
    next_run: null

  memory-client-sweep:
    description: "Sweep client-native memory entries into brain stores and regenerate MEMORY.md indexes (ADR-811)"
    script: project-brain/capabilities/skills/knowledge/scripts/memory_client_sweep.py
    schedule: daily
    hour: 5
    minute: 15
    enabled: true
    timeout_seconds: 300
    on_failure: notify
    category: knowledge
    last_run: null
    next_run: null

  # ============================================
  # COMPETITOR INTELLIGENCE (Weekly)
  # Note: Script is now in augur-data repo
  # ============================================
  scrape-competitors:
    description: "Scrape GitHub stars and metrics for tracked competitors"
    script: ${AUGUR_ROOT}/skills/venture/scripts/scrape_competitors.py  # TODO_OUTDATED: script was removed; needs reimplementation
    schedule: weekly
    day_of_week: 0  # Sunday
    hour: 4
    minute: 0
    enabled: false  # Disabled: scrape_competitors.py no longer exists in venture
    timeout_seconds: 300
    on_failure: review
    category: business
    last_run: null
    next_run: null
    metadata:
      competitors_tracked: 20
      sources:
        - github_stars
        - npm_downloads
        - linkedin_followers

  # ============================================
  # NOTIFICATIONS (Hourly)
  # Moved to daemon plugin — notifications skill was removed
  # ============================================
  process-notifications:
    description: "Send due scheduled notifications and reminders"
    script: ${AUGUR_ROOT}/project-brain/capabilities/skills/daemon/scripts/notification_service.py
    args: ["--process-due"]
    schedule: hourly
    enabled: false  # (planned) — notifications skill removed, needs reimplementation in daemon
    timeout_seconds: 60
    on_failure: silent
    category: services
    last_run: null
    next_run: null

  # ============================================
  # DATA EXPIRATION (Daily)
  # (planned) — data-expiration skill was removed
  # ============================================
  data-expiration:
    description: "Clean up expired data based on retention policies"
    script: ${AUGUR_ROOT}/project-brain/capabilities/skills/daemon/scripts/expire_data.py
    schedule: daily
    hour: 2
    minute: 30
    enabled: false  # (planned) — data-expiration skill removed, needs reimplementation
    timeout_seconds: 300
    on_failure: review
    category: operations
    last_run: null
    next_run: null

  # ============================================
  # MANUAL TASKS (No schedule, trigger only)
  # Note: Scripts are now in augur-data repo
  # ============================================
  security-audit:
    description: "Run security scan on codebase and dependencies"
    script: project-brain/capabilities/skills/daemon/scripts/ops/security_scan.py
    schedule: manual
    enabled: false  # validator skill is staged/draft-only; use daemon ops scanner until re-enabled
    timeout_seconds: 600
    on_failure: review
    category: quality
    last_run: null

  repo-health-check:
    description: "Check repository health and best practices"
    script: project-brain/capabilities/skills/platform-admin/scripts/check_repo_health.py
    schedule: manual
    enabled: true
    timeout_seconds: 300
    on_failure: review
    category: quality
    last_run: null

# Schedule reference:
#   daily: Runs once per day at specified hour:minute
#   weekly: Runs once per week on day_of_week (0=Sun, 6=Sat) at hour:minute
#   monthly: Runs once per month on day_of_month at hour:minute
#   hourly: Runs every hour at specified minute
#   manual: Never runs automatically, only via explicit trigger

# on_failure options:
#   review: Raise a review in pending_reviews.yaml for user attention
#   notify: Send system notification
#   silent: Log error but don't alert

# Categories:
#   operations: System maintenance tasks
#   business: Business intelligence tasks
#   services: Service-level tasks
#   quality: Code quality and security tasks
