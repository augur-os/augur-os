contributions:
  commands:
  - id: ops-daemon
    type: workflow
    visibility: ops
    description: 'Manage the Augur daemon: start, stop, restart, status'
  - id: auto-self-heal
    type: workflow
    visibility: auto
    description: Scan runtime logs for errors and delegate fixes to ai_self_healer
    callable: scripts/ops/self_heal.py
    protocol: scan-fix
    loop:
      name: self-heal
      tier: 1
      trigger: continuous
      scheduler: daemon
      config:
        min_severity: high
  - id: auto-page-mounts
    type: workflow
    visibility: auto
    description: Verify contributions.pages source files exist for all mounted plugins
    callable: scripts/ops/page_mounts.py
    protocol: scan-fix
    loop:
      name: hardening
      tier: 1
      trigger: nightly
      scheduler: codex
  - id: auto-security-scan
    type: workflow
    visibility: auto
    description: Scan for hardcoded secrets, npm vulnerabilities, and known CVEs
    callable: scripts/ops/security_scan.py
    protocol: scan-fix
    loop:
      name: hardening
      tier: 4
      trigger: nightly
      scheduler: codex
  - id: auto-stale-paths
    type: workflow
    visibility: auto
    description: Detect ADR-270 folder/path drift across active code, workflows, and
      operational docs
    callable: scripts/ops/stale_paths.py
    protocol: scan-fix
    loop:
      name: hardening
      tier: 1
      trigger: nightly
      scheduler: codex
      config:
        max_issues: 250
  - id: auto-code-health
    type: workflow
    visibility: auto
    description: Scan TypeScript build errors and API route health failures
    callable: scripts/ops/build_health.py
    protocol: scan-fix
    loop:
      name: hardening
      tier: 1
      trigger: nightly
      scheduler: codex
  - id: auto-skill-md
    type: workflow
    visibility: auto
    description: Validate and generate SKILL.md files per Claude Code skills standard
    callable: scripts/ops/skill_standards_md.py
    protocol: scan-fix
    loop:
      name: skill-standards
      tier: 1
      trigger: nightly
      scheduler: codex
  - id: auto-skill-refs
    type: workflow
    visibility: auto
    description: Validate and fix SKILL.md file references and folder structure
    callable: scripts/ops/skill_standards_refs.py
    protocol: scan-fix
    loop:
      name: skill-standards
      tier: 2
      trigger: nightly
      scheduler: codex
  - id: auto-heal-validate
    type: workflow
    visibility: auto
    description: Validate self-heal daemon health and clear stuck journal entries
    callable: scripts/ops/heal_validate.py
    protocol: scan-fix
    loop:
      name: self-heal
      tier: 1
      trigger: nightly
      scheduler: codex
  - id: auto-memory-consolidation
    type: workflow
    visibility: auto
    description: Detect memory index bloat and consolidate fragments
    callable: scripts/ops/memory_consolidation.py
    protocol: scan-fix
    loop:
      name: knowledge-enrichment
      tier: 1
      trigger: nightly
      scheduler: codex
      config:
        max_index_chars: 30000
        max_index_entries: 50
  - id: auto-mcp-hygiene
    type: workflow
    visibility: auto
    description: Per-plugin MCP tool naming, registration, dead-tool, and duplicate
      audit
    callable: scripts/ops/mcp_hygiene.py
    protocol: scan-fix
    loop:
      name: code-quality
      tier: 1
      trigger: nightly
      scheduler: codex
  blocks:
  - id: loops
    type: ops-board
    title: Adaptive Loops
    icon: Activity
    config_schema:
      show_probation:
        type: boolean
        default: true
    # TODO_BUG: stale_config — get-daemon-loop-status is not registered in the MCP server.
    # Block data_source removed to avoid runtime errors; restore once the tool is wired.
    search:
      enabled: true
      fields:
      - name
      - status
      placeholder: Search loops...
    filters:
    - field: status
      type: pills
      values:
      - active
      - disabled
      - probation
  - id: notifications
    type: activity-feed
    title: Notifications
    icon: Bell
    config_schema:
      show_dismissed:
        type: boolean
        default: false
    data_source:
      mcp_tool: list-notifications
    search:
      enabled: true
      fields:
      - title
      - message
      - severity
      placeholder: Search notifications...
    # TODO_BUG: stale_config — dismiss-old-notifications is not registered in the MCP server.
    # Row action removed to avoid runtime errors; restore once the tool is wired.
  - id: services
    type: ops-board
    title: External Services
    icon: Layers
    config_schema: {}
    # TODO_BUG: stale_config — get-daemon-status is not registered in the MCP server.
    # Block data_source removed to avoid runtime errors; restore once the tool is wired.
  - id: daemon-health
    type: ops-board
    title: Daemon Health
    icon: HeartPulse
    config_schema: {}
    # TODO_BUG: stale_config — get-daemon-status is not registered in the MCP server.
    # Block data_source removed to avoid runtime errors; restore once the tool is wired.
  - id: jobs
    type: data-table
    title: Daemon Jobs
    icon: Workflow
    config_schema: {}
    # TODO_BUG: stale_config — get-daemon-loop-status is not registered in the MCP server.
    # Block data_source removed to avoid runtime errors; restore once the tool is wired.
  - id: metrics
    type: chart
    title: System Metrics
    icon: BarChart3
    config_schema: {}
    data_source:
      mcp_tool: metrics
  - id: loop-execution-chart
    type: chart
    title: Loop Executions (24h)
    icon: Activity
    config_schema: {}
    # TODO_BUG: stale_config — get-daemon-loop-history is not registered in the MCP server.
    # Block data_source removed to avoid runtime errors; restore once the tool is wired.
    chart:
      type: area
      x_field: hour
      y_field: executions
      color: blue
      height: 180

# Job ledger — crash-safe run records (ADR-743). Skill-internal config.
job_ledger:
  heartbeat_threshold_s: 300      # a running job silent longer than this is "stale"
  retention_days: 30              # terminal jobs older than this are archived
  resubmit_allowlist: []          # loop names the supervisor may auto-resubmit once
