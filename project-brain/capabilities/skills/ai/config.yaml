hub:
  id: brain
  owner: false
contributions:
  agent_sources:
    rules: docs/agent-topics/agent-rules.md
    workflows: docs/agent-topics
    skills: docs/agent-topics
    topics: docs/agent-topics
  pages:
  - id: agents
    title: Agents
    icon: Bot
    order: 15
    devOnly: true
    purpose: Route execution control, client sync health, provider readiness, and
      dispatch consequences.
    keywords:
    - execution
    - routing
    - sync
    - provider
    - dispatch
  commands:
  - id: ask
    type: workflow
    visibility: core
    description: Ask your second brain any question about Augur — searches ADRs, memory,
      skills, and all knowledge sources.
  - id: commands
    type: workflow
    visibility: core
    description: Show all available slash commands with descriptions
  - id: ops-learn
    type: workflow
    visibility: ops
    description: Extract learnings from current thread and persist to memory + docs
  - id: reindex-rag
    type: workflow
    visibility: auto
    description: Rebuild centralized RAG indexes for skills with plugin-local or vault-backed
      markdown content
    callable: scripts/ops/rag_reindex.py
    protocol: scan-fix
    loop:
      name: knowledge-enrichment
      tier: 0
      trigger: nightly
  - id: auto-rag-reindex
    type: workflow
    visibility: auto
    description: Legacy alias for reindex-rag that keeps the old /auto-rag-reindex
      command surface alive
    callable: scripts/ops/rag_reindex.py
    protocol: scan-fix
    loop:
      name: knowledge-enrichment
      tier: 0
      trigger: nightly
  - id: reindex-project
    type: workflow
    visibility: auto
    description: Rebuild the master project index of skills, pages, actions, and commands
    callable: scripts/ops/project_index.py
    protocol: scan-fix
    loop:
      name: knowledge-enrichment
      tier: 0
      trigger: nightly
  - id: auto-project-index
    type: workflow
    visibility: auto
    description: Legacy alias for reindex-project that preserves the old /auto-project-index
      command surface
    callable: scripts/ops/project_index.py
    protocol: scan-fix
    loop:
      name: knowledge-enrichment
      tier: 0
      trigger: nightly
  - id: auto-index-notes
    type: workflow
    visibility: auto
    description: Detect notes markdown files missing from skill index caches and rebuild
    callable: scripts/ops/index_notes.py
    protocol: scan-fix
    loop:
      name: knowledge-enrichment
      tier: 1
      trigger: nightly
  - id: auto-analytics
    type: workflow
    visibility: auto
    description: Generate usage analytics from LLM execution logs via nightly maintenance
    callable: scripts/ops/analytics.py
    protocol: scan-fix
    loop:
      name: knowledge-enrichment
      tier: 1
      trigger: nightly
  - id: sync-agents
    type: workflow
    visibility: auto
    description: Detect IDE config drift and regenerate agent configs via the sync_agents
      package entrypoint
    callable: scripts/ops/agent_sync.py
    protocol: scan-fix
    loop:
      name: knowledge-enrichment
      tier: 1
      trigger: post-execution
  - id: auto-command-evolution
    type: workflow
    visibility: auto
    description: Scan command execution logs and evolve SKILL.md files with learned
      improvements
    callable: scripts/ops/command_evolution.py
    protocol: scan-fix
    loop:
      name: command-evolution
      tier: 0
      trigger: post-execution
  - id: auto-memory-sync
    type: workflow
    visibility: auto
    description: Curate daily logs to MEMORY.md and distribute to all agent targets
    callable: scripts/ops/memory_sync_ops.py
    protocol: scan-fix
    loop:
      name: knowledge-enrichment
      tier: 1
      trigger: nightly
  - id: auto-agent-digest
    type: workflow
    visibility: auto
    description: Compile violation signals into Hot/Warm digest sections prepended
      to MEMORY.md
    callable: scripts/ops/agent_digest/compile_digest.py
    protocol: scan-fix
    loop:
      name: auto-agent-digest
      tier: 1
      trigger: nightly
  - id: flag
    type: workflow
    visibility: ops
    description: Record a directive violation for the next agent digest run
  - id: dev-sync
    type: workflow
    visibility: ops
    description: Inspect client sync status and discover client-native skills across
      IDE targets
  - id: auto-doc-freshness
    type: workflow
    visibility: auto
    description: Detect stale docs and broken internal links across docs/ and SKILL.md
      files
    callable: scripts/ops/doc_freshness.py
    protocol: scan-fix
    loop:
      name: knowledge-enrichment
      tier: 2
      trigger: nightly
  - id: onboard
    type: workflow
    visibility: core
    description: First-run setup wizard for fresh Augur installations
  - id: auto-skill-enhance
    type: workflow
    visibility: auto
    description: Scan command logs and generate missing descriptions for skill improvement
    callable: scripts/ops/skill_enhance_ops.py
    protocol: scan-fix
    loop:
      name: knowledge-enrichment
      tier: 2
      trigger: nightly
  blocks:
  - id: agents
    type: ops-board
    title: Agents
    icon: Bot
    config_schema:
      show_offline:
        type: boolean
        default: true
      layout:
        type: enum
        options:
        - grid
        - list
        default: grid
    data_source:
      mcp_tool: manage-cli-agents
  - id: providers
    type: ops-board
    title: Providers
    icon: Cloud
    config_schema:
      show_usage:
        type: boolean
        default: true
    data_source:
      mcp_tool: manage-tools-catalog
  - id: setup
    type: action-bar
    title: Setup Wizard
    icon: Wand2
    config_schema: {}
    data_source:
      mcp_tool: get-ai-status
  - id: provider-tabs
    type: tabbed
    title: AI Providers
    icon: Cloud
    config_schema: {}
    data_source:
      mcp_tool: get-ai-status
    tabs:
    - id: status
      label: Status
      source: get-ai-status
    - id: usage
      label: Usage
      source: manage-tools-catalog
    - id: models
      label: Models
      source: list-agent-capabilities
modals:
  configure-agent:
    title: Configure Agent
    description: Add or update a CLI agent launch profile
    submitTool: /api/ai/agents/configure
    submitLabel: Save Agent
    fields:
    - name: agent_id
      label: Agent ID
      type: text
      required: true
      placeholder: e.g., claude, codex, kimi-local
    - name: binary
      label: Binary or Command
      type: text
      required: true
      placeholder: e.g., claude --dangerously-skip-permissions
    - name: model
      label: Default Model
      type: text
      required: false
      placeholder: e.g., claude-opus-4-6
    - name: mcp_enabled
      label: Enable MCP bridge hints
      type: boolean
      required: false
