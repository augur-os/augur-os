contributions:
  blocks:
  - id: factory-create
    type: action-bar
    title: Create Plugin
    icon: Plus
    expandTo: ''
    config_schema: {}
    data_source:
      mcp_tool: list-templates
  - id: factory-audit
    type: ops-board
    title: Plugin Audit
    icon: ShieldCheck
    expandTo: ''
    search: true
    config_schema: {}
    data_source:
      mcp_tool: audit-plugin
  - id: templates
    type: card-grid
    title: Templates
    icon: FileCode
    expandTo: ''
    search: true
    view_modes:
    - grid
    - list
    config_schema: {}
    data_source:
      mcp_tool: list-templates
  - id: migrate
    type: action-bar
    title: Migrate
    icon: ArrowRightLeft
    expandTo: ''
    config_schema: {}
    data_source:
      mcp_tool: list-migration-candidates
  - id: import
    type: action-bar
    title: Import
    icon: FolderInput
    expandTo: ''
    config_schema: {}
    data_source:
      mcp_tool: scan-importable-plugins
  - id: page-builder
    type: action-bar
    title: Page Builder
    icon: LayoutDashboard
    config_schema: {}
    data_source:
      mcp_tool: get-focused-tools
  actions:
  - id: create-plugin
    label: Create Plugin
    description: Launch plugin creation wizard
    icon: Plus
    dispatch: ide
    mcp_tools:
    - create-plugin
    devOnly: false
  - id: audit-plugin
    label: Audit Plugins
    description: Run MCP compliance audit across plugins and summarize failures
    icon: ShieldCheck
    dispatch: oneshot
    mcp_tools:
    - audit-plugin
    prompt: 'Run the MCP tool `audit-plugin` for all plugins.

      Return:

      1. Overall summary (passing/warning/failing)

      2. Top 10 lowest-scoring plugins

      3. 3 highest-impact fixes to raise compliance fastest

      '
    devOnly: false
  - id: migrate-skill
    label: Migrate Skill
    description: Migrate existing skill to compliant plugin format
    icon: ArrowRightLeft
    dispatch: ide
    mcp_tools:
    - skill-analyze
    - workflow-start
    devOnly: false
  - id: import-skill
    label: Import Skill
    description: Discover and import an external plugin into a target Augur bundle
    icon: FolderInput
    dispatch: ide
    mcp_tools:
    - scan-importable-plugins
    - import-skill
    prompt: 'Help the user import an external plugin package.

      Steps:

      1. Use `scan-importable-plugins` to suggest likely sources.

      2. Ask which source path should be imported and target bundle.

      3. Run `import-skill` in dry-run first.

      4. If dry-run is clean, run actual import and summarize changes.

      5. Recommend any follow-up audit or migration fixes.

      '
    devOnly: false
  - id: verify-mounts
    label: Verify Plugin Mounts
    description: Check for stale or directly-edited mounted files
    icon: CheckCircle
    dispatch: fire
    mcp_tool: verify-plugin-mounts
    endpoint: /api/dev/verify-mounts
  - id: verify-wiring
    label: Verify Action Wiring
    description: Check all dashboard actions have valid targets
    icon: Link
    dispatch: fire
    mcp_tool: verify-action-wiring
    endpoint: /api/dev/verify-wiring
