# Stage 3: Data Structures Questions
# These questions gather information for schemas and storage patterns

stage: 3
name: "Data Structures"
description: "Define schemas and storage patterns for the skill"

questions:
  - id: primary_entity
    text: "What is the primary data entity for ${skill_name}?"
    type: text
    default: "${skill_name_snake}"
    required: true
    context: "e.g., 'recipe' for a recipes skill, 'task' for a task manager"

  - id: entity_fields
    text: "What fields should the primary entity have? (comma-separated)"
    type: text
    default: "id, name, description, created_at, updated_at"
    required: true
    context: "Common fields: id, name, description, status, tags, created_at, updated_at"

  - id: storage_type
    text: "What storage pattern should be used?"
    type: choice
    options:
      - yaml_files
      - sqlite
      - json_files
      - hybrid
    default: "yaml_files"
    required: true
    context: |
      yaml_files: Human-readable, git-friendly. Best for config-like data.
      sqlite: Structured queries. Best for large datasets with relations.
      json_files: Lightweight, good for simple key-value data.
      hybrid: Combine YAML for config + SQLite for records.

  - id: additional_entities
    text: "Are there additional entities to define? (comma-separated names)"
    type: text
    default: ""
    required: false
    context: "e.g., 'ingredient, instruction' for a recipes skill"
