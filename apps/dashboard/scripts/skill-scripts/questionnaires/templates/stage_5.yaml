# Stage 5: UI Generation Questions
# These questions gather information for dashboard component generation

stage: 5
name: "UI Generation"
description: "Generate dashboard components for the skill"

questions:
  - id: additional_tabs
    text: "Current tabs: ${current_tabs}. Add more? (comma-separated)"
    type: text
    default: ""
    required: false
    context: "Common tabs: Settings, Analytics, History, Logs"

  - id: color_scheme
    text: "What color scheme should the UI use?"
    type: choice
    options:
      - default
      - blue
      - green
      - purple
      - orange
    default: "default"
    required: true
    context: "Accent color for charts and highlights. 'default' uses the system theme."

  - id: include_charts
    text: "Should the UI include data visualization charts?"
    type: yes_no
    default: false
    required: true
    context: "If yes, recharts library will be used for visualizations."

  - id: overview_layout
    text: "What layout should the overview page use?"
    type: choice
    options:
      - cards
      - list
      - dashboard
      - kanban
    default: "cards"
    required: true
    context: |
      cards: Grid of summary cards (default, good for status)
      list: Vertical list of items (good for history/logs)
      dashboard: Full dashboard with widgets (complex skills)
      kanban: Column-based drag-drop (task management)

  - id: include_skeleton
    text: "Generate loading skeletons for all pages?"
    type: yes_no
    default: true
    required: true
    context: "Skeleton loaders improve perceived performance."
