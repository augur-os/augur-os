# Quality Assessment Questions
# American-style multiple choice questions to gather user input
# for quality scoring and improvement prioritization
#
# Used before and after refactoring to measure plugin quality

stage: 0  # Pre-stage quality assessment
name: "Quality Assessment"
description: "Evaluate plugin quality before and after refactoring"

questions:
  # ===== PROBLEM ALIGNMENT (3 questions) =====
  - id: problem_clarity
    text: "How clearly does this plugin define the problem it solves?"
    type: choice
    options:
      - value: 5
        label: "Very clear - I immediately understand what it does and why"
      - value: 4
        label: "Mostly clear - The purpose is evident with minor ambiguity"
      - value: 3
        label: "Somewhat clear - I get the general idea but details are fuzzy"
      - value: 2
        label: "Unclear - I have to dig through files to understand"
      - value: 1
        label: "Very unclear - I cannot determine the plugin's purpose"
    required: true
    context: "Based on reading SKILL.md and dashboard.yaml"

  - id: problem_relevance
    text: "How relevant is this plugin to your actual needs?"
    type: choice
    options:
      - value: 5
        label: "Essential - I would use this daily"
      - value: 4
        label: "Very useful - I would use this weekly"
      - value: 3
        label: "Somewhat useful - I would use this occasionally"
      - value: 2
        label: "Marginally useful - Nice to have but not necessary"
      - value: 1
        label: "Not useful - Does not address my needs"
    required: true
    context: "Consider your personal workflow and habits"

  - id: missing_problem_aspects
    text: "Which aspects of the problem are NOT addressed by this plugin?"
    type: multi_choice
    options:
      - value: data_import
        label: "Importing existing data from other sources"
      - value: data_export
        label: "Exporting data for backup or sharing"
      - value: automation
        label: "Automated workflows or triggers"
      - value: search
        label: "Searching and filtering capabilities"
      - value: reporting
        label: "Reports or analytics"
      - value: collaboration
        label: "Sharing or collaboration features"
      - value: mobile
        label: "Mobile or offline access"
      - value: none
        label: "All key aspects are covered"
    required: true
    context: "Select all that apply"

  # ===== ACTION COVERAGE (3 questions) =====
  - id: action_completeness
    text: "How complete is the set of actions/buttons for this plugin?"
    type: choice
    options:
      - value: 5
        label: "Complete - All actions I need are available"
      - value: 4
        label: "Mostly complete - Missing 1-2 minor actions"
      - value: 3
        label: "Partially complete - Missing several useful actions"
      - value: 2
        label: "Incomplete - Many obvious actions are missing"
      - value: 1
        label: "Very incomplete - Only basic actions exist"
    required: true
    context: "Review the actions section in dashboard.yaml"

  - id: action_flow_preference
    text: "For the main workflow, what action dispatch type do you prefer?"
    type: choice
    options:
      - value: fire
        label: "Fire - Immediate execution without AI"
      - value: oneshot
        label: "Oneshot - Single AI task with focused assistance"
      - value: modal
        label: "Modal forms - Structured input before execution"
      - value: mixed
        label: "Mixed - Different dispatches for different actions"
    required: true
    context: "This helps prioritize which actions need redesign"

  - id: missing_actions
    text: "What key actions are missing from this plugin?"
    type: text
    default: ""
    required: false
    context: "List any actions you expected but didn't find (comma-separated)"

  # ===== DATA STRUCTURE (2 questions) =====
  - id: data_organization
    text: "How well does the data structure match how you think about this domain?"
    type: choice
    options:
      - value: 5
        label: "Perfect match - Exactly how I organize this type of data"
      - value: 4
        label: "Good match - Minor adjustments would help"
      - value: 3
        label: "Acceptable - Works but feels awkward"
      - value: 2
        label: "Poor match - I would organize things differently"
      - value: 1
        label: "Wrong approach - Fundamentally misaligned"
    required: true
    context: "Consider the YAML files in data/ and entities defined"

  - id: data_growth_concern
    text: "What concerns you most about data accumulation over time?"
    type: choice
    options:
      - value: search
        label: "Finding specific items will become difficult"
      - value: performance
        label: "The plugin will slow down with lots of data"
      - value: organization
        label: "Data will become messy and disorganized"
      - value: backup
        label: "Losing data or not having good backups"
      - value: none
        label: "No significant concerns"
    required: true
    context: "Think about using this plugin for 1+ years"

  # ===== UI/ACCESS (2 questions) =====
  - id: ui_navigation
    text: "How easy is it to navigate and find things in the UI?"
    type: choice
    options:
      - value: 5
        label: "Very easy - Intuitive navigation throughout"
      - value: 4
        label: "Easy - Minor friction in some areas"
      - value: 3
        label: "Moderate - Takes some time to find things"
      - value: 2
        label: "Difficult - Frequently get lost or confused"
      - value: 1
        label: "Very difficult - UI is confusing and frustrating"
    required: true
    context: "Based on the tabs and layout in dashboard.yaml"

  - id: quick_access_priority
    text: "What do you need quickest access to in this plugin?"
    type: choice
    options:
      - value: recent
        label: "Most recent items"
      - value: frequent
        label: "Most frequently used items"
      - value: important
        label: "Items marked as important/starred"
      - value: pending
        label: "Items requiring action"
      - value: search
        label: "Global search across everything"
    required: true
    context: "This helps design the Overview tab"

  # ===== OVERALL & PRIORITIES (2 questions) =====
  - id: biggest_gap
    text: "What is the single biggest gap in this plugin?"
    type: choice
    options:
      - value: actions
        label: "Missing or incomplete actions"
      - value: data
        label: "Poor data structure or storage"
      - value: ui
        label: "Bad UI/UX design"
      - value: integration
        label: "Lack of integrations with other tools"
      - value: automation
        label: "No automation or workflows"
      - value: none
        label: "No significant gaps"
    required: true
    context: "If you could fix one thing, what would it be?"

  - id: improvement_priority
    text: "Rank your top 3 improvement priorities"
    type: multi_choice
    max_selections: 3
    options:
      - value: more_actions
        label: "Add more actions/buttons"
      - value: better_data
        label: "Improve data organization"
      - value: better_ui
        label: "Improve UI/navigation"
      - value: automation
        label: "Add automation/triggers"
      - value: search
        label: "Better search/filtering"
      - value: reporting
        label: "Add reports/analytics"
      - value: integrations
        label: "Add external integrations"
    required: true
    context: "This guides the refactoring priorities"
