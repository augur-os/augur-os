# Route Registry - Metadata for API routes
# This file provides additional context for the /dev/routes dashboard
# Auto-detected values can be overridden here
#
# Last updated: 2026-01-13 (Phase 4 MCP Migration Complete)

# Group definitions
groups:
  A:
    name: "MCP Compliant"
    description: "Uses createAPIRoute - fully MCP integrated"
    color: "green"
  B:
    name: "Dashboard-only"
    description: "Dashboard-local routes (complex handling); not routed through the MCP proxy. The former pythonRunner was deleted in ADR-817 — these routes never imported it."
    color: "yellow"
  C:
    name: "Legacy spawn/exec"
    description: "Direct child_process - complex file handling"
    color: "red"
  D:
    name: "IDE Bridge"
    description: "Spawns Claude Desktop for LLM tasks"
    color: "blue"
  E:
    name: "File I/O Only"
    description: "No execution - just reads/writes data files"
    color: "gray"
  F:
    name: "Exceptions"
    description: "Documented spawn exceptions (Swift CLI, detached processes)"
    color: "purple"

# Route metadata overrides
# Only routes that need metadata beyond auto-detection are listed here
routes:
  # ============================================
  # Group A: MCP Compliant - Migrated Routes
  # ============================================

  /api/agents/route:
    status: migrated
    mcpTool: route-agent-request
    purpose: "Route requests to appropriate agent - cross-agent delegation"

  /api/agents/status:
    status: migrated
    mcpTool: get-factory-status
    purpose: "Returns agent health, weights, active chains"

  /api/agents/recalculate:
    status: migrated
    mcpTool: update-agent-weights
    purpose: "Recalculates agent skill weights based on performance"

  /api/agents/chain:
    status: migrated
    mcpTool: skill-action
    purpose: "Execute agent chain/workflow via skill-action"

  /api/agents/wizard/generate:
    status: migrated
    mcpTool: generate-skill
    purpose: "Generate new skill from wizard"

  /api/agents/wizard/documents/analyze:
    status: migrated
    mcpTool: analyze-import
    purpose: "Analyze documents for import"

  /api/mcp/focused:
    status: migrated
    mcpTool: get-focused-tools
    purpose: "Get context-aware MCP tool selection for task optimization"

  /api/mcp/tools:
    status: migrated
    mcpTool: list-mcp-tools
    purpose: "List and configure MCP tools"

  /api/inbox/items:
    status: migrated
    mcpTool: refresh-inbox
    purpose: "Get inbox items with routing suggestions"

  /api/inbox/desktop:
    status: migrated
    mcpTool: refresh-inbox
    purpose: "Scan desktop for inbox items"

  /api/rag/reindex:
    status: migrated
    mcpTool: index-documents
    purpose: "Reindex RAG documents"

  /api/reviews:
    status: migrated
    mcpTool: manage-reviews
    purpose: "Manage skill review queue - list, approve, reject, defer"

  /api/security/audit:
    status: migrated
    mcpTool: query-audit-log
    purpose: "Query or log security audit events"

  /api/setup/adaptive-growth:
    status: migrated
    mcpTool: adaptive-growth-cycle
    purpose: "Generate growth tasks from metrics - agent self-improvement"

  /api/setup/llm/ide/instructions:
    status: migrated
    mcpTool: generate-ide-instructions
    purpose: "Generate IDE-specific instructions for Cursor/Copilot/Antigravity"

  /api/setup/skills/list:
    status: migrated
    mcpTool: list-skills
    purpose: "Lists all registered skills"

  # ============================================
  # Group B: Dashboard-only routes
  # These intentionally remain dashboard-local (not via the MCP proxy).
  # The pythonRunner module was deleted in ADR-817; these never imported it.
  # ============================================

  /api/mcp/summary:
    status: dashboard-only
    reason: "Complex diagnostics with TypeScript helpers - 378 lines"
    sensitive: false
    purpose: "MCP config diagnostics (reads Claude/Cursor configs, checks processes)"

  /api/security/audit/export:
    status: dashboard-only
    reason: "SECURITY: Compliance/audit data - NEVER expose to agents"
    sensitive: true
    purpose: "Export audit logs (JSON/CSV)"

  /api/setup/llm/usage:
    status: migrated
    mcpTool: get-usage-stats
    sensitive: false
    purpose: "LLM usage statistics and token counts"

  /api/setup/llm/ide/backlog:
    status: migrated
    mcpTool: backlog-list
    sensitive: false
    purpose: "List IDE instruction backlog items"

  /api/setup/llm/ide/command:
    status: migrated
    mcpTool: command-execute
    sensitive: false
    purpose: "Execute IDE commands (copy, open, etc)"

  /api/setup/llm/ide/detect:
    status: dashboard-only
    reason: "Meta operation - environment detection"
    sensitive: false
    purpose: "Detect installed IDEs (Cursor, VS Code, etc)"

  /api/setup/skills/export:
    status: dashboard-only
    reason: "Admin - packaging function for skill distribution"
    sensitive: false
    purpose: "Export skill as zip package"

  /api/setup/skills/import:
    status: dashboard-only
    reason: "Complex file upload handling (multipart forms)"
    sensitive: false
    mcpTool: apply-import
    purpose: "Import skill plugins from file/URL"

  /api/ide/integrations:
    status: dashboard-only
    reason: "IDE health and config management"
    sensitive: false
    purpose: "Check IDE health, status, and configuration"

  /api/venture/competition:
    status: dashboard-only
    reason: "SENSITIVE: Competitive intelligence data"
    sensitive: true
    purpose: "Competitor analysis and tracking"

  /api/venture/competition/risk:
    status: dashboard-only
    reason: "SENSITIVE: Strategic planning data"
    sensitive: true
    purpose: "Competitive risk scoring and analysis"

  # ============================================
  # Group C: Legacy spawn routes
  # Complex file handling that's difficult to migrate
  # ============================================

  /api/agents/wizard/import/apply:
    status: legacy
    reason: "Complex file upload + UI generation + validation - 705 lines, multiple spawn calls"
    purpose: "Apply skill import with UI scaffolding"

  /api/mcp/switch-context:
    status: legacy
    reason: "Inline Python for ContextManager - needs MCP tool wrapper"
    purpose: "Switch MCP tool context by enabling/disabling groups"

  /api/context/load:
    status: legacy
    reason: "Inline Python for ContextInjector - needs MCP tool wrapper"
    purpose: "Load enriched context for chat interface"

  /api/wizard/analyze-placement:
    status: legacy
    reason: "Inline Python for placement_analyzer - needs MCP tool wrapper"
    purpose: "Analyze where to place new skills in codebase"

  /api/wizard/enhance:
    status: retired
    reason: "enhance-dashboard MCP tool retired in Track 3a PR 2"
    purpose: "Build enhancement context and send to IDE (legacy)"

  # ============================================
  # Group D: IDE Bridge routes
  # Correctly use Claude Desktop for LLM tasks
  # ============================================

  /api/venture/competition/discover:
    status: ide-bridge
    reason: "Requires web search and human verification"
    purpose: "Research new competitors via Claude Desktop"

  /api/venture/competition/update-profiles:
    status: ide-bridge
    reason: "Requires web search and judgment"
    purpose: "Refresh competitor data via Claude Desktop"

  # ============================================
  # Group E: File I/O Only routes
  # These are correctly classified - no execution needed
  # ============================================

  /api/mcp/capabilities:
    status: ok
    mcpTool: list-mcp-tools
    purpose: "Lists available MCP tools and capabilities"

  /api/registry:
    status: ok
    mcpTool: list-skills
    purpose: "Skills registry listing"

  /api/setup/skills/manager:
    status: ok
    mcpTool: toggle-skill
    purpose: "Enable/disable skills"

  /api/venture/metrics:
    status: dashboard-only
    reason: "SENSITIVE: Strategic business data"
    sensitive: true
    purpose: "Business metrics (GitHub stars, Discord members, revenue)"

  /api/career/status:
    status: dashboard-only
    reason: "PRIVATE: Personal career data"
    sensitive: true
    purpose: "Personal career tracking and goals"

  # ============================================
  # Group F: Documented exceptions (keep spawn)
  # ============================================

  /api/voice/record:
    status: exception
    reason: "Swift CLI binary - native macOS, not Python. Process lifecycle management."
    purpose: "Voice recording via MeetingRecorderCLI"

  /api/agents/wizard/documents/index:
    status: exception
    reason: "Long-running background process - must survive HTTP response, detached with PID tracking"
    purpose: "Background document indexing for RAG"

  /api/services:
    status: exception
    reason: "macOS launchctl - system service management"
    purpose: "Start/stop macOS services"

  /api/agents/onboarding/test/[test]:
    status: exception
    reason: "Test execution with process isolation"
    purpose: "Run onboarding tests"

  /api/permissions/status:
    status: exception
    reason: "OS-level permission checks - osascript, powershell, spawn required for macOS/Windows APIs"
    purpose: "Check system permissions (microphone, screen recording, accessibility)"

  /api/rag/search:
    status: exception
    reason: "Uses ripgrep (rg) CLI for fast text search - cannot be replaced with Python"
    purpose: "High-performance RAG index search using ripgrep"
