name: Claude Code

# Unified Claude Code workflow:
# - @claude-ask: Read-only assistance on PRs/issues
# - @claude-fix: Apply changes and commit to PR branch
# - @claude-review: Code review on PR
# - @claude-review-fix: Code review + auto-apply fixes

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  # ============================================
  # @claude-ask - Read-only assistance
  # ============================================
  claude-ask:
    if: |
      (github.event.comment.user.type != 'Bot' || github.event_name == 'issues') &&
      (
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude-ask')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude-ask')) ||
        (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude-ask')) ||
        (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude-ask') || contains(github.event.issue.title, '@claude-ask')))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            actions: read

  # ============================================
  # @claude-fix - Apply changes and commit to PR
  # ============================================
  claude-fix:
    if: |
      github.repository == 'augur-os/augur-os' && vars.AUGUR_ENABLE_WRITEBACK_BOTS == 'true' &&
      github.event.comment.user.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude-fix')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude-fix'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            } else {
              prNumber = context.payload.pull_request.number;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('is_fork', pr.data.head.repo.fork);
            core.setOutput('pr_number', prNumber);

      - name: Fail if PR is from a fork
        if: steps.pr.outputs.is_fork == 'true'
        run: |
          echo "::error::Cannot push to forked PR branches for security reasons."
          exit 1

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Run Claude Code to apply fixes
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are responding to a @claude-fix request on a GitHub PR.

            The user requested:
            "${{ github.event.comment.body }}"

            Instructions:
            1. Analyze the request and the current PR changes
            2. Make the minimal code changes needed to address the request
            3. Ensure formatting and linting stays consistent with the codebase
            4. Do not change unrelated code
            5. IMPORTANT: After making changes, commit them to the PR branch with a descriptive commit message

            The PR is on branch: ${{ steps.pr.outputs.head_ref }}
            Requested by: ${{ github.event.comment.user.login }}
          additional_permissions: |
            actions: read

      - name: Add reaction to comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Add failure reaction
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            });

  # ============================================
  # Auto-fix after Codex Cloud review
  # Triggers when Codex bot posts a review comment with suggestions
  # ============================================
  codex-review-auto-fix:
    if: |
      github.repository == 'augur-os/augur-os' && vars.AUGUR_ENABLE_WRITEBACK_BOTS == 'true' &&
      github.event_name == 'issue_comment' &&
      github.event.issue.pull_request &&
      contains(github.event.comment.user.login, 'codex') &&
      contains(github.event.comment.body, 'Codex Review')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.payload.issue.number;
            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });
            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('is_fork', pr.data.head.repo.fork);
            core.setOutput('pr_number', prNumber);

      - name: Fail if PR is from a fork
        if: steps.pr.outputs.is_fork == 'true'
        run: |
          echo "::error::Cannot push to forked PR branches for security reasons."
          exit 1

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Run Claude Code to apply Codex fixes
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            Codex has reviewed this PR and posted suggestions. Here is the review:

            "${{ github.event.comment.body }}"

            Instructions:
            1. Carefully read Codex's review feedback above
            2. Apply all the fixes and changes that Codex recommended
            3. For each issue Codex identified, make the appropriate code change
            4. Ensure formatting and linting stays consistent with the codebase
            5. IMPORTANT: After making all changes, commit them with a message like:
               "fix: apply changes from Codex review"

            The PR is on branch: ${{ steps.pr.outputs.head_ref }}
          additional_permissions: |
            actions: read

      - name: Post completion comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.pr_number }},
              body: '✅ Claude has applied the fixes from Codex review. Please review the changes.'
            });

  # ============================================
  # @claude-review - Code review on PR (review only)
  # ============================================
  claude-review:
    if: |
      github.repository == 'augur-os/augur-os' && vars.AUGUR_ENABLE_WRITEBACK_BOTS == 'true' &&
      github.event.comment.user.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude-review') && !contains(github.event.comment.body, '@claude-review-fix')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude-review') && !contains(github.event.comment.body, '@claude-review-fix'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Get PR number
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            } else {
              prNumber = context.payload.pull_request.number;
            }
            core.setOutput('pr_number', prNumber);

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ steps.pr.outputs.pr_number }}'

  # ============================================
  # @claude-review-fix - Review + Auto-apply fixes
  # ============================================
  claude-review-fix:
    if: |
      github.repository == 'augur-os/augur-os' && vars.AUGUR_ENABLE_WRITEBACK_BOTS == 'true' &&
      github.event.comment.user.type != 'Bot' &&
      (
        (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@claude-review-fix')) ||
        (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude-review-fix'))
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            } else {
              prNumber = context.payload.pull_request.number;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('is_fork', pr.data.head.repo.fork);
            core.setOutput('pr_number', prNumber);

      - name: Fail if PR is from a fork
        if: steps.pr.outputs.is_fork == 'true'
        run: |
          echo "::error::Cannot push to forked PR branches for security reasons."
          exit 1

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Run Claude Code Review + Fix
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            You are performing a code review with auto-fix on PR #${{ steps.pr.outputs.pr_number }}.

            Instructions:
            1. Review the code changes in this PR thoroughly
            2. Identify issues: bugs, code quality problems, security concerns, performance issues
            3. For each issue you find:
               - If it's fixable, make the fix directly
               - If it requires human decision, note it in a comment
            4. After making all fixes, commit them with a descriptive message
            5. Post a summary comment listing:
               - Issues found and fixed
               - Issues that need human review
               - Overall assessment of the PR

            The PR is on branch: ${{ steps.pr.outputs.head_ref }}
            Triggered by: ${{ github.event.comment.user.login }}
          additional_permissions: |
            actions: read

      - name: Add reaction to comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Add failure reaction
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            });
