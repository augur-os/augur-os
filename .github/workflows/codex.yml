name: Codex

# Unified Codex workflow using local CLI (subscription-based):
# - @codex-ask: Read-only assistance on PRs/issues
# - @codex-fix: Apply changes and commit to PR branch
# - @codex-review: Code review on PR
#
# Requires: Codex CLI available on runner with `codex login` completed

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

jobs:
  # ============================================
  # @codex-ask - Read-only assistance
  # ============================================
  codex-ask:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@codex-ask')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex-ask')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@codex-ask')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@codex-ask') || contains(github.event.issue.title, '@codex-ask')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Extract prompt from comment
        id: prompt
        uses: actions/github-script@v7
        with:
          script: |
            let body = '';
            if (context.eventName === 'issue_comment') {
              body = context.payload.comment.body;
            } else if (context.eventName === 'pull_request_review_comment') {
              body = context.payload.comment.body;
            } else if (context.eventName === 'pull_request_review') {
              body = context.payload.review.body;
            } else if (context.eventName === 'issues') {
              body = context.payload.issue.body || context.payload.issue.title;
            }
            // Remove the @codex-ask trigger from the prompt
            const prompt = body.replace(/@codex-ask\s*/gi, '').trim();
            core.setOutput('text', prompt);

      - name: Run Codex CLI
        id: codex
        run: |
          # Run codex with the prompt and capture output
          OUTPUT=$(codex -q "${{ steps.prompt.outputs.text }}" 2>&1) || true
          # Save to file to handle multi-line output
          echo "$OUTPUT" > /tmp/codex_output.txt

      - name: Post response as comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/codex_output.txt', 'utf8');

            let issueNumber;
            if (context.eventName === 'issues') {
              issueNumber = context.payload.issue.number;
            } else if (context.eventName === 'issue_comment') {
              issueNumber = context.payload.issue.number;
            } else {
              issueNumber = context.payload.pull_request.number;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
              body: `## 🤖 Codex Response\n\n${output}`
            });

  # ============================================
  # @codex-fix - Apply changes and commit to PR
  # ============================================
  codex-fix:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@codex-fix')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex-fix'))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            } else {
              prNumber = context.payload.pull_request.number;
            }

            const pr = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            core.setOutput('head_ref', pr.data.head.ref);
            core.setOutput('is_fork', pr.data.head.repo.fork);
            core.setOutput('pr_number', prNumber);

      - name: Fail if PR is from a fork
        if: steps.pr.outputs.is_fork == 'true'
        run: |
          echo "::error::Cannot push to forked PR branches for security reasons."
          exit 1

      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          fetch-depth: 0

      - name: Extract prompt from comment
        id: prompt
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment.body;
            const prompt = body.replace(/@codex-fix\s*/gi, '').trim();
            core.setOutput('text', prompt);

      - name: Run Codex CLI to apply fixes
        run: |
          # Run codex in full-auto mode to make changes
          codex -a full-auto "${{ steps.prompt.outputs.text }}"

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git add -A
            git commit -m "fix: apply codex changes

            Requested by: ${{ github.event.comment.user.login }}
            Request: ${{ steps.prompt.outputs.text }}"
            git push
          fi

      - name: Add reaction to comment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'rocket'
            });

      - name: Add failure reaction
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.reactions.createForIssueComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: context.payload.comment.id,
              content: 'confused'
            });

  # ============================================
  # @codex-review - Code review on PR
  # ============================================
  codex-review:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@codex-review')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex-review'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            } else {
              prNumber = context.payload.pull_request.number;
            }
            core.setOutput('pr_number', prNumber);

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        id: diff
        run: |
          git fetch origin main
          git diff origin/main...HEAD > /tmp/pr_diff.txt

      - name: Run Codex CLI for review
        run: |
          DIFF=$(cat /tmp/pr_diff.txt)
          PROMPT="Please review this code diff and provide feedback on:
          1. Code quality and best practices
          2. Potential bugs or issues
          3. Performance considerations
          4. Security concerns
          5. Suggestions for improvement

          Be constructive and specific.

          Diff:
          $DIFF"

          codex -q "$PROMPT" > /tmp/codex_review.txt 2>&1 || true

      - name: Post review as comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/codex_review.txt', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.pr_number }},
              body: `## 🤖 Codex Code Review\n\n${review}`
            });

  # ============================================
  # @codex-review-claude-fix - Codex reviews, Claude fixes
  # ============================================
  codex-review-claude-fix:
    if: |
      (github.event_name == 'issue_comment' && github.event.issue.pull_request && contains(github.event.comment.body, '@codex-review-claude-fix')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@codex-review-claude-fix'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Get PR info
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            let prNumber;
            if (context.eventName === 'issue_comment') {
              prNumber = context.payload.issue.number;
            } else {
              prNumber = context.payload.pull_request.number;
            }
            core.setOutput('pr_number', prNumber);

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR diff
        run: |
          git fetch origin main
          git diff origin/main...HEAD > /tmp/pr_diff.txt

      - name: Run Codex CLI for review
        run: |
          DIFF=$(cat /tmp/pr_diff.txt)
          PROMPT="Please review this code diff and identify specific issues that need fixing.

          For each issue found, describe:
          1. The file and location
          2. What the problem is
          3. How to fix it

          Focus on actionable fixes for:
          - Bugs and logic errors
          - Code quality issues
          - Security concerns
          - Performance problems

          Be specific and concise. Format as a numbered list of fixes needed.

          Diff:
          $DIFF"

          codex -q "$PROMPT" > /tmp/codex_review.txt 2>&1 || true

      - name: Post review and trigger Claude fix
        continue-on-error: true
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.TRIGGER_PAT }}
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('/tmp/codex_review.txt', 'utf8');

            // Post the review with @claude-fix trigger
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.pr.outputs.pr_number }},
              body: `## 🤖 Codex Code Review\n\n${review}\n\n---\n\n@claude-fix Please apply the fixes identified above.`
            });
