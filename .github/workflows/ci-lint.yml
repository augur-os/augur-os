name: 'CI: Lint & Format'

# Static analysis: linting, formatting, type checks, audits
# Does NOT run tests - see ci-tests.yml for that

on:
  schedule:
    - cron: '0 3 * * *'  # Nightly at 03:00 AM UTC
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to use'
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
        default: 'ubuntu-latest'

jobs:
  # ============================================
  # CHANGE DETECTION
  # ============================================
  detect-changes:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      python_changed: ${{ steps.changes.outputs.python_changed }}
      dashboard_changed: ${{ steps.changes.outputs.dashboard_changed }}
      ops_changed: ${{ steps.changes.outputs.ops_changed }}
      mcp_changed: ${{ steps.changes.outputs.mcp_changed }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changes
        id: changes
        run: |
          # On schedule or manual dispatch, run ALL checks unconditionally
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "python_changed=true" >> "$GITHUB_OUTPUT"
            echo "dashboard_changed=true" >> "$GITHUB_OUTPUT"
            echo "ops_changed=true" >> "$GITHUB_OUTPUT"
            echo "mcp_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
            if [[ -z "$BASE" || "$BASE" == "0000000000000000000000000000000000000000" ]]; then
              BASE="$(git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD^)"
            fi
          fi

          CHANGED_FILES=$(git diff --name-only "$BASE" "${{ github.sha }}" 2>/dev/null || echo "")

          # Check for Python changes
          if echo "$CHANGED_FILES" | grep -qE '\.py$'; then
            echo "python_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "python_changed=false" >> "$GITHUB_OUTPUT"
          fi

          # Check for dashboard changes
          if echo "$CHANGED_FILES" | grep -qE '^apps/dashboard/'; then
            echo "dashboard_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "dashboard_changed=false" >> "$GITHUB_OUTPUT"
          fi

          # Check for ops changes
          if echo "$CHANGED_FILES" | grep -qE '^src/(scripts|config)/'; then
            echo "ops_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "ops_changed=false" >> "$GITHUB_OUTPUT"
          fi

          # Check for MCP changes
          if echo "$CHANGED_FILES" | grep -qE '^src/mcp/|^config/mcp_tool'; then
            echo "mcp_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================
  # PYTHON QUALITY
  # ============================================
  python-quality:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.python_changed == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.5"

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install ruff black mypy pyyaml

      - name: Ruff lint
        run: |
          source .venv/bin/activate
          TARGETS="src tests"
          if [ -d "packages" ]; then
            TARGETS="$TARGETS packages"
          fi
          if [ -d "skills" ]; then
            TARGETS="$TARGETS skills"
          fi
          echo "=== Running Ruff Linter ==="
          ruff check $TARGETS --output-format=github

      - name: Black format check
        run: |
          source .venv/bin/activate
          TARGETS="src tests"
          if [ -d "packages" ]; then
            TARGETS="$TARGETS packages"
          fi
          if [ -d "skills" ]; then
            TARGETS="$TARGETS skills"
          fi
          echo "=== Checking Black Formatting ==="
          black --check $TARGETS

      - name: Mypy type check
        # ADVISORY (continue-on-error): this step had always exited 2 on a
        # nonexistent `shared` target, so mypy never actually ran/enforced. Fixed
        # the target to src/config + src/mcp; it now RUNS and reports, but surfaces
        # ~58 pre-existing type errors (object-typing debt, platform-specific
        # msvcrt.locking on non-Windows, etc.). Driving mypy fully clean is a
        # tracked typing follow-up; ruff + black above remain the hard gates.
        continue-on-error: true
        run: |
          source .venv/bin/activate
          echo "=== Running Mypy Type Checker (advisory) ==="
          mypy src/config src/mcp --ignore-missing-imports --no-error-summary

  # ============================================
  # PYTHON AUDITS
  # ============================================
  python-audits:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.python_changed == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system pyyaml

      - name: Audit hardcoded paths
        run: |
          echo "=== Auditing Hardcoded Paths ==="
          python .github/scripts/audit_paths.py .

      - name: Validate entity boundaries
        run: |
          echo "=== Validating Entity Boundaries ==="
          python .github/scripts/validate_boundaries.py

      - name: Audit logging usage
        run: |
          echo "=== Auditing Logging Usage ==="
          python .github/scripts/audit_logging.py

      - name: Audit data separation
        run: |
          echo "=== Auditing Data Separation ==="
          python .github/scripts/audit_data_separation.py

      - name: Validate structure
        run: |
          echo "=== Validating Repository Structure ==="
          python .github/scripts/validate_structure.py

      - name: Validate command parity (ADR-251)
        run: |
          echo "=== Validating Command Parity ==="
          PYTHONPATH=${{ github.workspace }} python .github/scripts/validate_command_parity.py

  # ============================================
  # PATH VALIDATION
  # ============================================
  path-validation:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.ops_changed == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system pyyaml

      - name: Validate file placements
        run: |
          echo "=== Validating File Placements ==="
          python project-brain/capabilities/skills/platform-admin/scripts/cleanup_paths.py --check

      - name: Check runtime gitignore
        run: |
          echo "=== Checking Runtime Gitignore ==="
          python .github/scripts/check_runtime_gitignore.py
        continue-on-error: true

      - name: Check file sizes
        run: |
          echo "=== Checking File Sizes ==="
          python .github/scripts/check_sizes.py
        continue-on-error: true

  # ============================================
  # TYPESCRIPT/DASHBOARD QUALITY
  # ============================================
  typescript-quality:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.dashboard_changed == 'true' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: ${{ runner.os }}-pnpm-${{ hashFiles('apps/dashboard/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: apps/dashboard
        run: pnpm install --frozen-lockfile

      - name: ESLint
        working-directory: apps/dashboard
        run: |
          echo "=== Running ESLint ==="
          pnpm lint

      - name: TypeScript type check
        working-directory: apps/dashboard
        run: |
          echo "=== Running TypeScript Type Check ==="
          pnpm typecheck

      - name: Next.js build check
        working-directory: apps/dashboard
        run: |
          echo "=== Building Next.js Application ==="
          pnpm build

      - name: Validate navigation alignment
        working-directory: apps/dashboard
        run: |
          echo "=== Validating Navigation / Pages ==="
          # validate-tab-registry was removed; the current validators are
          # validate-nav-alignment + validate-no-legacy-pages (built by build:scripts).
          pnpm build:scripts
          node scripts/dist/validate-nav-alignment.mjs
          node scripts/dist/validate-no-legacy-pages.mjs --all

  # ============================================
  # YAML VALIDATION
  # ============================================
  yaml-validation:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system pyyaml

      - name: Validate YAML files
        run: |
          echo "=== Validating YAML Files ==="
          python -c "
          import yaml
          import glob
          import sys
          import re

          def parse_yaml_with_frontmatter(content):
              '''Parse YAML that may have frontmatter followed by Markdown.'''
              if content.startswith('---'):
                  match = re.match(r'^---\n(.*?)\n---', content, re.DOTALL)
                  if match:
                      return yaml.safe_load(match.group(1))
              return yaml.safe_load(content)

          errors = []
          for pattern in ['packages/**/*.yaml', 'project-brain/capabilities/skills/**/*.yaml', 'src/**/*.yaml', 'data/**/*.yaml', '.github/**/*.yaml']:
              for f in glob.glob(pattern, recursive=True):
                  if 'node_modules' in f or '.venv' in f:
                      continue
                  try:
                      with open(f) as file:
                          content = file.read()
                          parse_yaml_with_frontmatter(content)
                      print(f'✅ {f}')
                  except Exception as e:
                      errors.append(f'❌ {f}: {e}')

          if errors:
              print()
              for e in errors:
                  print(e)
              sys.exit(1)
          else:
              print()
              print('All YAML files are valid!')
          "

  # ============================================
  # MCP PERFORMANCE CHECKS
  # ============================================
  mcp-performance:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.mcp_changed == 'true' || github.event_name == 'workflow_dispatch'

    env:
      MAX_CORE_TOOLS: 25
      MAX_TOOL_LIST_KB: 50

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system pyyaml

      - name: Check core tools count
        run: |
          python << 'EOF'
          import json
          import yaml
          import sys
          from pathlib import Path

          # ADR-260: Try assembled config first
          config_path = Path("config/dashboard/generated/assembled_tool_config.json")
          if not config_path.exists():
              config_path = Path("config/mcp_tool_groups.yaml")
          if not config_path.exists():
              print("⚠️ Tool config not found, skipping")
              sys.exit(0)

          with open(config_path) as f:
              if config_path.suffix == ".json":
                  config = json.load(f)
              else:
                  config = yaml.safe_load(f)

          core_tools = config.get("core_tools", [])
          max_core = int("${{ env.MAX_CORE_TOOLS }}")

          print(f"📊 Core tools count: {len(core_tools)} (threshold: {max_core})")

          if len(core_tools) > max_core:
              print(f"❌ FAIL: Core tools ({len(core_tools)}) exceeds threshold")
              sys.exit(1)
          else:
              print("✅ PASS: Core tools within threshold")
          EOF

      - name: Check for duplicate tool names
        run: |
          python << 'EOF'
          import sys
          from pathlib import Path
          import re

          # A real registration is an @mcp.tool(...) decorator (args may span
          # multiple lines) immediately followed by the decorated function. This
          # anchoring skips literal "@mcp.tool(name=...)" strings quoted inside a
          # scanner's own docstrings / regex comments — those are documentation,
          # not registrations.
          decorator_re = re.compile(
              r'@mcp\.tool\((?P<args>.*?)\)\s*\n(?:\s*@[^\n]*\n)*\s*(?:async\s+)?def\b',
              re.DOTALL,
          )
          name_re = re.compile(r'name\s*=\s*["\']([^"\']+)["\']')

          # Test/fixture/example/demo files register placeholder tool names that
          # are never loaded by the runtime, so they are out of scope.
          SKIP_MARKERS = ("/tests/", "/test_", "fixtures", "examples", "demo")

          def bundle_for(path: Path) -> str:
              """Top-level registration bundle. Cross-bundle same-name tools are
              intentional (a tool exported by both augur-core and augur-framework,
              or by a skill); only a collision WITHIN one bundle is a real bug."""
              p = path.as_posix()
              if "/augur_core/" in p:
                  return "augur_core"
              if "/augur_framework/" in p:
                  return "augur_framework"
              marker = "project-brain/capabilities/skills/"
              if marker in p:
                  return "skill:" + p.split(marker, 1)[1].split("/", 1)[0]
              return "other"

          # (bundle, tool_name) -> set of files registering it
          groups: dict[tuple[str, str], set[str]] = {}
          total = 0

          for search_path in [Path("src/mcp"), Path("project-brain") / "capabilities" / "skills"]:
              if not search_path.exists():
                  continue
              for py_file in search_path.rglob("*.py"):
                  if any(marker in py_file.as_posix() for marker in SKIP_MARKERS):
                      continue
                  try:
                      content = py_file.read_text()
                  except Exception:
                      continue
                  for match in decorator_re.finditer(content):
                      name_match = name_re.search(match.group("args"))
                      if not name_match:
                          continue
                      total += 1
                      key = (bundle_for(py_file), name_match.group(1))
                      groups.setdefault(key, set()).add(py_file.as_posix())

          duplicates = {key: sorted(files) for key, files in groups.items() if len(files) > 1}

          print(f"📊 Total tool registrations: {total}; unique (bundle, name) pairs: {len(groups)}")

          if duplicates:
              print(f"❌ FAIL: {len(duplicates)} same-bundle duplicate tool names:")
              for (bundle, name), files in duplicates.items():
                  print(f"   [{bundle}] '{name}': {files}")
              sys.exit(1)
          else:
              print("✅ PASS: No same-bundle duplicate tool names")
          EOF

  # ============================================
  # QUALITY SUMMARY
  # ============================================
  quality-summary:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: [python-quality, python-audits, path-validation, typescript-quality, yaml-validation, mcp-performance]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "=== Quality Gates Summary ==="
          FAILED=false

          for job in python-quality python-audits path-validation typescript-quality yaml-validation mcp-performance; do
            result="${{ needs.python-quality.result }}"
            case $job in
              python-quality) result="${{ needs.python-quality.result }}" ;;
              python-audits) result="${{ needs.python-audits.result }}" ;;
              path-validation) result="${{ needs.path-validation.result }}" ;;
              typescript-quality) result="${{ needs.typescript-quality.result }}" ;;
              yaml-validation) result="${{ needs.yaml-validation.result }}" ;;
              mcp-performance) result="${{ needs.mcp-performance.result }}" ;;
            esac

            if [[ "$result" == "failure" ]]; then
              echo "❌ $job: FAILED"
              FAILED=true
            elif [[ "$result" == "success" ]]; then
              echo "✅ $job: PASSED"
            else
              echo "⏭️ $job: SKIPPED"
            fi
          done

          echo ""
          if [[ "$FAILED" == "true" ]]; then
            echo "Some quality gates failed!"
            exit 1
          else
            echo "All quality gates passed!"
          fi
