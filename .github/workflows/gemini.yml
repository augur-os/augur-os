name: Gemini Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  gemini-review:
    name: Review with Gemini
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request &&
        contains(github.event.comment.body, '@gemini-cli /review')
      )
    runs-on: ubuntu-latest
    # Expose the key as env so steps can gate on its presence (secrets context is
    # not available in `if:`). On the public repo (no secret) the Gemini steps skip
    # and the job stays green; on the maintainer repo it runs normally.
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Resolve PR context
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const number = context.payload.pull_request?.number || context.payload.issue?.number || "";
            const ref = context.payload.pull_request?.head?.sha ||
              (context.payload.issue?.number ? `refs/pull/${context.payload.issue.number}/merge` : "");
            core.setOutput("number", number);
            core.setOutput("ref", ref);

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.pr.outputs.ref }}

      - name: Build review prompt
        id: prompt
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.comment?.body || "";
            const extra = body.replace("@gemini-cli /review", "").trim();
            const prompt = [
              "You are reviewing this Augur pull request in read/review mode.",
              "Do not commit, push, create branches, or create pull requests.",
              "Focus on bugs, regressions, missing tests, and unsafe cloud-execution changes.",
              extra ? `Additional user context: ${extra}` : ""
            ].filter(Boolean).join("\n");
            core.setOutput("text", prompt);

      - name: Run Gemini CLI review
        id: gemini
        if: ${{ env.GEMINI_API_KEY != '' }}
        uses: google-github-actions/run-gemini-cli@v0
        with:
          gemini_api_key: ${{ secrets.GEMINI_API_KEY }}
          github_pr_number: ${{ steps.pr.outputs.number }}
          prompt: ${{ steps.prompt.outputs.text }}
          settings: |
            {
              "tools": {
                "core": ["read_file", "grep_search", "glob", "list_directory"]
              }
            }

      - name: Publish Gemini review comment
        if: ${{ always() && env.GEMINI_API_KEY != '' && steps.pr.outputs.number != '' }}
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          GEMINI_SUMMARY: ${{ steps.gemini.outputs.summary }}
          GEMINI_ERROR: ${{ steps.gemini.outputs.error }}
        with:
          script: |
            const prNumber = Number(process.env.PR_NUMBER);
            if (!Number.isInteger(prNumber) || prNumber <= 0) {
              core.setFailed(`Invalid pull request number: ${process.env.PR_NUMBER || ""}`);
              return;
            }

            const summary = (process.env.GEMINI_SUMMARY || "").trim();
            const error = (process.env.GEMINI_ERROR || "").trim();
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              "## Gemini Review",
              summary || "Gemini completed without a textual summary. See the workflow run for details.",
            ];

            if (error) {
              const truncated = error.length > 4000 ? `${error.slice(0, 4000)}\n...` : error;
              body.push(`### Gemini error\n\`\`\`\n${truncated}\n\`\`\``);
            }

            body.push(`[Workflow run](${runUrl})`);

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: body.join("\n\n"),
            });
