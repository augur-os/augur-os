name: 'CD: Release'

# Release automation workflow
# Handles release automation for skills and packages
# Validates dependencies before releasing

on:
  workflow_dispatch:
    inputs:
      skill:
        description: 'Skill to release'
        required: true
        type: choice
        options:
          - job-analyzer
          - interview-prep
          - reading-list
          - ideas-capture
          - voice-memos
          - local-rag
          - recipe-manager
          - social-media-post
          - setup-manager
          - next-skill
          - all
      bump:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      dry_run:
        description: 'Dry run (no actual release)'
        required: false
        type: boolean
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system pyyaml
      
      - name: Configure Git
        run: |
          git config user.email "actions@github.com"
          git config user.name "DevOps Agent"

      - name: Verify Ops Layer - Documentation sync
        run: |
          echo "=== Ops Layer: Checking dependency status before release ==="
          PYTHONPATH="$PWD/project-brain/capabilities:$PWD:$PWD/src/mcp" python project-brain/capabilities/skills/platform-admin/scripts/dependency_tracker.py status | tee deps_output.txt

          # Count files needing attention
          NEEDS_UPDATE=$(grep -c "NEEDS UPDATE\|MISSING" deps_output.txt || true)

          if [ "$NEEDS_UPDATE" -gt 0 ]; then
            echo ""
            echo "❌ ERROR: $NEEDS_UPDATE file(s) are out of sync."
            echo ""
            echo "Ops Layer validation failed. Run '/refactor' in Claude Code to update dependent files before releasing."
            echo ""
            PYTHONPATH="$PWD/project-brain/capabilities:$PWD:$PWD/src/mcp" python project-brain/capabilities/skills/platform-admin/scripts/dependency_tracker.py rebuild-order
            exit 1
          fi

          echo ""
          echo "✅ Ops Layer: All documentation is in sync. Proceeding with release."

      - name: Map skill to path
        id: skill_path
        run: |
          declare -A path_map=(
            ["job-analyzer"]="vertical/careers"
            ["interview-prep"]="vertical/interview"
            ["ideas-capture"]="vertical/ideas"
            ["recipe-manager"]="vertical/recipes"
            ["social-media-post"]="vertical/marketing"
            ["reading-list"]="vertical/reading"
            ["local-rag"]="horizontal/memory"
            ["voice-memos"]="horizontal/voice"
            ["setup-manager"]="factory/devops"
            ["next-skill"]="factory/architect"
          )
          SKILL_PATH="${path_map[${{ inputs.skill }}]:-${{ inputs.skill }}}"
          echo "skill_path=$SKILL_PATH" >> "$GITHUB_OUTPUT"
          echo "Skill path: $SKILL_PATH"

      - name: Run release script (Ops Layer automation)
        id: release
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
          fi
          
          PYTHONPATH="$PWD/project-brain/capabilities:$PWD:$PWD/src/mcp" python project-brain/capabilities/skills/platform-admin/scripts/release.py ${{ inputs.skill }} --${{ inputs.bump }} $DRY_RUN_FLAG
      
      - name: Push changes and tags
        if: ${{ inputs.dry_run == false }}
        run: |
          git push origin main --tags
      
      - name: Create GitHub Release
        if: ${{ inputs.dry_run == false && inputs.skill != 'all' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.skill }}-v${{ steps.release.outputs.version }}
          name: "${{ inputs.skill }} v${{ steps.release.outputs.version }}"
          body: |
            Release of ${{ inputs.skill }} version ${{ steps.release.outputs.version }}
            
            Released via CD: Release workflow
            
            See CHANGELOG.md in packages/${{ steps.skill_path.outputs.skill_path }}/ for details.
          files: releases/*
          draft: false
          prerelease: false
