name: partition-integrity

on:
  pull_request:
  push:
    branches: [main]

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install PyYAML
        run: pip install pyyaml
      - name: Partition-integrity scan
        env:
          AUGUR_PRIVATE_MARKER_REGEX: ${{ secrets.AUGUR_PRIVATE_MARKER_REGEX }}
        run: python scripts/scan_partition_integrity.py
