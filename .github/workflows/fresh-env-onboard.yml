name: 'Gate: Fresh-Env Onboard'

# Clean-runner proof that a fresh augur-os clone installs to a working system.
# Tiered: Linux on every PR/push; all 3 OSes on schedule + when called by release.
# See docs/superpowers/specs/2026-06-16-fresh-env-onboarding-gate-m4-design.md.

# Least-privilege: this gate only checks out and runs the install/verify; it
# performs no writes. Pin to read-only so it does not inherit the caller's token.
permissions:
  contents: read

# Fresh runners have no cached pnpm; the pinned packageManager triggers corepack's
# interactive download prompt, which fails non-interactively. Auto-approve it.
env:
  COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'

on:
  workflow_call:
    inputs:
      os_set:
        description: 'all | linux'
        type: string
        default: 'all'
  pull_request:
    branches: [main]
    paths:
      - 'src/lib/onboard/**'
      - 'src/cli_onboard.py'
      - 'config/system/command_surfaces.yaml'
      - 'apps/dashboard/**'
      - 'scripts/ci/fresh_env_verify.py'
      - 'tests/dashboard/visual/fresh-env-browse.spec.ts'
      - '.github/workflows/fresh-env-onboard.yml'
  schedule:
    - cron: '0 7 * * 0'  # Weekly, Sunday 07:00 UTC (all OSes)
  workflow_dispatch:

jobs:
  set-matrix:
    runs-on: ubuntu-latest
    outputs:
      os: ${{ steps.pick.outputs.os }}
    steps:
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          elif [ "${{ inputs.os_set }}" = "linux" ]; then
            echo 'os=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'os=["ubuntu-latest","macos-latest","windows-latest"]' >> "$GITHUB_OUTPUT"
          fi

  fresh-env:
    needs: set-matrix
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(needs.set-matrix.outputs.os) }}
    runs-on: ${{ matrix.os }}
    name: fresh-env (${{ matrix.os }})
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install uv
        uses: astral-sh/setup-uv@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install ripgrep (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep
      - name: Install ripgrep (macOS)
        if: runner.os == 'macOS'
        run: brew install ripgrep
      - name: Install ripgrep (Windows)
        if: runner.os == 'Windows'
        run: choco install ripgrep -y
      - name: Run onboard engine (non-interactive)
        run: uv run aug onboard run --non-interactive
      - name: Start dashboard (background, persists across steps)
        shell: bash
        run: |
          nohup uv run aug dev build > dashboard.log 2>&1 &
          echo "started dashboard (pid $!)"
      - name: Install Playwright browser
        run: |
          cd apps/dashboard
          pnpm exec playwright install --with-deps chromium
      - name: Fresh-env verify (poll + Playwright client-load)
        run: uv run python scripts/ci/fresh_env_verify.py --base-url http://localhost:3000
      - name: Upload dashboard log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-log-${{ matrix.os }}
          path: dashboard.log
