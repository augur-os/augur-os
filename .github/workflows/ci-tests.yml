name: 'CI: Tests'

# Runs pytest and Jest tests with coverage
# Does NOT lint - see ci-lint.yml for that

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 4 * * *'  # Nightly at 04:00 AM UTC
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner to use'
        type: choice
        options:
          - ubuntu-latest
          - macos-latest
        default: 'ubuntu-latest'

jobs:
  # ============================================
  # PUBLIC RELEASE GUARD
  # ============================================
  public-release-guard:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install pyyaml

      - name: Build and guard public release tree
        run: |
          PUBLIC_TREE="$(mktemp -d)"
          python scripts/build_public_release_tree.py \
            --config config/system/release_scope.yaml \
            --source-root "$PWD" \
            --output-root "$PUBLIC_TREE"
          python scripts/guard_public_release_tree.py --root "$PUBLIC_TREE"

  # ============================================
  # CHANGE DETECTION
  # ============================================
  detect-changes:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: read
    outputs:
      skill_matrix: ${{ steps.changes.outputs.matrix }}
      has_skills: ${{ steps.changes.outputs.has_skills }}
      dashboard_changed: ${{ steps.changes.outputs.dashboard_changed }}
      mcp_changed: ${{ steps.changes.outputs.mcp_changed }}
      run_all: ${{ steps.changes.outputs.run_all }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine base ref
        id: base
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            PR_BASE_SHA=$(jq -r '.pull_request.base.sha // empty' "$GITHUB_EVENT_PATH")
            echo "base_sha=$PR_BASE_SHA" >> "$GITHUB_OUTPUT"
          else
            base=$(jq -r '.before // empty' "$GITHUB_EVENT_PATH")
            if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
              base="$(git merge-base HEAD origin/main 2>/dev/null || git rev-parse HEAD^)"
            fi
            echo "base_sha=$base" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Detect changes and build matrix
        id: changes
        run: |
          # On schedule or manual dispatch, run ALL tests unconditionally
          if [[ "${{ github.event_name }}" == "schedule" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_all=true" >> "$GITHUB_OUTPUT"
            echo "dashboard_changed=true" >> "$GITHUB_OUTPUT"
            echo "mcp_changed=true" >> "$GITHUB_OUTPUT"
            python project-brain/capabilities/skills/platform-admin/scripts/ci_change_detector.py --all
            exit 0
          fi

          echo "run_all=false" >> "$GITHUB_OUTPUT"
          python project-brain/capabilities/skills/platform-admin/scripts/ci_change_detector.py "${{ steps.base.outputs.base_sha }}" "${{ github.sha }}"

          # Additional detection for MCP changes
          CHANGED_FILES=$(git diff --name-only "${{ steps.base.outputs.base_sha }}" "${{ github.sha }}" 2>/dev/null || echo "")
          if echo "$CHANGED_FILES" | grep -qE '^src/mcp/'; then
            echo "mcp_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "mcp_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # ============================================
  # SKILL TESTS (Matrix)
  # ============================================
  skill-tests:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.has_skills == 'true' || needs.detect-changes.outputs.run_all == 'true'
    strategy:
      matrix:
        skill: ${{ fromJson(needs.detect-changes.outputs.skill_matrix) }}
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.5"

      - name: Install system dependencies (OCR-related skills)
        if: matrix.skill.name == 'local-rag' || matrix.skill.name == 'ocr'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-heb poppler-utils qpdf ghostscript

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate

          uv pip install pytest pytest-cov pytest-asyncio pyyaml tomli-w

          # Install skill dependencies if they exist
          SKILL_DIR="${{ matrix.skill.path }}"
          if [ -f "$SKILL_DIR/pyproject.toml" ]; then
            uv pip install -e "$SKILL_DIR"
          elif [ -f "$SKILL_DIR/_dev/requirements.txt" ]; then
            uv pip install -r "$SKILL_DIR/_dev/requirements.txt"
          fi

      - name: Run skill tests
        env:
          TOKENIZERS_PARALLELISM: "false"
          LOCAL_RAG_REAL_OCR_DEPS: "1"
          PYTHONPATH: "project-brain/capabilities:.:src/mcp:${{ matrix.skill.path }}"
        run: |
          source .venv/bin/activate
          SKILL_DIR="${{ matrix.skill.path }}"
          TEST_DIR="$SKILL_DIR/tests"

          if [ -d "$TEST_DIR" ]; then
            echo "🧪 Running tests for ${{ matrix.skill.name }}..."
            # Coverage is ADVISORY per-skill: many skills are declarative (SKILL.md
            # + yaml + structural tests) with little/no covered python, so a blanket
            # per-skill --cov-fail-under hard-gate fails them spuriously. Tests still
            # run and must pass; coverage is reported (and uploaded) but not gated.
            pytest "$TEST_DIR" \
              --verbose \
              --cov="$SKILL_DIR" \
              --cov-report=term-missing
          else
            echo "⚠️ No tests directory found at $TEST_DIR"
          fi

      - name: Upload skill coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-skill-${{ matrix.skill.name }}
          path: .coverage
          retention-days: 30

  # ============================================
  # ROOT TESTS
  # ============================================
  root-tests:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: detect-changes

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.5"

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install pytest pytest-cov pytest-asyncio pyyaml httpx tomli-w
          uv pip install -e src/mcp

      - name: Validate test placement
        env:
          PYTHONPATH: "project-brain/capabilities:."
        run: |
          source .venv/bin/activate
          python scripts/check_skill_test_placement.py

      - name: Guard worktree global identity isolation
        env:
          PYTHONPATH: "project-brain/capabilities:."
        run: |
          source .venv/bin/activate
          python scripts/check_global_identity_drift.py --root "$PWD" --json
          python -m pytest tests/config/test_runtime_identity.py tests/config/test_global_identity_drift.py tests/test_worktree_global_identity_isolation.py -q

      - name: Guard Python test module identity
        env:
          PYTHONPATH: "project-brain/capabilities:."
        run: |
          source .venv/bin/activate
          echo "=== Running full root test suite in one process ==="
          python -m pytest tests/ -q -p no:cacheprovider

      - name: Run root tests
        env:
          PYTHONPATH: "project-brain/capabilities:."
        run: |
          source .venv/bin/activate
          echo "=== Running Root Tests ==="
          pytest tests/ \
            --verbose \
            --ignore=tests/integration/ \
            --cov=shared \
            --cov-report=term-missing

      - name: Upload coverage data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-root
          path: .coverage
          retention-days: 30

  # ============================================
  # INTEGRATION TESTS
  # ============================================
  integration-tests:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: detect-changes

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.5"

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install pytest pytest-asyncio pyyaml httpx
          uv pip install -e src/mcp

      - name: Run integration tests
        env:
          PYTHONPATH: "project-brain/capabilities:.:src/mcp"
        run: |
          source .venv/bin/activate
          echo "=== Running Integration Tests ==="
          pytest tests/integration/ --verbose

  # ============================================
  # MCP INTEGRATION TESTS
  # ============================================
  mcp-tests:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.mcp_changed == 'true' || needs.detect-changes.outputs.run_all == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.5"

      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv pip install pytest pytest-asyncio pyyaml httpx
          uv pip install -e src/mcp

      - name: Run MCP tests
        env:
          PYTHONPATH: "project-brain/capabilities:.:src/mcp"
        run: |
          source .venv/bin/activate
          echo "=== Running MCP Integration Tests ==="
          pytest tests/mcp/ --verbose

  # ============================================
  # DASHBOARD TESTS
  # ============================================
  dashboard-tests:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.dashboard_changed == 'true' || needs.detect-changes.outputs.run_all == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: ${{ runner.os }}-pnpm-${{ hashFiles('apps/dashboard/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: apps/dashboard
        run: pnpm install --frozen-lockfile

      - name: Run Jest tests
        working-directory: apps/dashboard
        run: |
          echo "=== Running Dashboard Tests ==="
          pnpm test --coverage --passWithNoTests

      - name: Upload dashboard coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dashboard
          path: apps/dashboard/coverage/
          retention-days: 30

  # ============================================
  # VISUAL REGRESSION TESTS (Nightly/Dispatch only)
  # ============================================
  visual-regression:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: detect-changes
    if: needs.detect-changes.outputs.run_all == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store/v10
          key: ${{ runner.os }}-pnpm-${{ hashFiles('apps/dashboard/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-

      - name: Install dependencies
        working-directory: apps/dashboard
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: apps/dashboard
        run: pnpm dlx playwright install chromium

      - name: Build Next.js
        working-directory: apps/dashboard
        run: pnpm build

      - name: Run visual regression tests
        working-directory: apps/dashboard
        run: |
          echo "=== Running Visual Regression Tests ==="
          pnpm dlx playwright test || true

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: visual-regression-screenshots
          path: |
            ~/Library/Application Support/Augur/state/visual-regression/
            ~/.local/state/augur/visual-regression/
          retention-days: 30

  # ============================================
  # TEST SUMMARY
  # ============================================
  test-summary:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    needs: [skill-tests, root-tests, integration-tests, mcp-tests, dashboard-tests, visual-regression]
    if: always()

    steps:
      - name: Check results
        run: |
          echo "=== Test Suite Summary ==="

          if [[ "${{ needs.skill-tests.result }}" == "failure" ]]; then
            echo "❌ Skill Tests: FAILED"
            exit 1
          elif [[ "${{ needs.skill-tests.result }}" == "success" ]]; then
            echo "✅ Skill Tests: PASSED"
          else
            echo "⏭️ Skill Tests: SKIPPED"
          fi

          if [[ "${{ needs.root-tests.result }}" == "failure" ]]; then
            echo "❌ Root Tests: FAILED"
            exit 1
          elif [[ "${{ needs.root-tests.result }}" == "success" ]]; then
            echo "✅ Root Tests: PASSED"
          else
            echo "⏭️ Root Tests: SKIPPED"
          fi

          if [[ "${{ needs.integration-tests.result }}" == "failure" ]]; then
            echo "❌ Integration Tests: FAILED"
            exit 1
          elif [[ "${{ needs.integration-tests.result }}" == "success" ]]; then
            echo "✅ Integration Tests: PASSED"
          else
            echo "⏭️ Integration Tests: SKIPPED"
          fi

          if [[ "${{ needs.mcp-tests.result }}" == "failure" ]]; then
            echo "❌ MCP Tests: FAILED"
            exit 1
          elif [[ "${{ needs.mcp-tests.result }}" == "success" ]]; then
            echo "✅ MCP Tests: PASSED"
          else
            echo "⏭️ MCP Tests: SKIPPED"
          fi

          if [[ "${{ needs.dashboard-tests.result }}" == "failure" ]]; then
            echo "❌ Dashboard Tests: FAILED"
            exit 1
          elif [[ "${{ needs.dashboard-tests.result }}" == "success" ]]; then
            echo "✅ Dashboard Tests: PASSED"
          else
            echo "⏭️ Dashboard Tests: SKIPPED"
          fi

          if [[ "${{ needs.visual-regression.result }}" == "failure" ]]; then
            echo "❌ Visual Regression: FAILED"
            exit 1
          elif [[ "${{ needs.visual-regression.result }}" == "success" ]]; then
            echo "✅ Visual Regression: PASSED"
          else
            echo "⏭️ Visual Regression: SKIPPED"
          fi

          echo ""
          echo "All tests passed!"
