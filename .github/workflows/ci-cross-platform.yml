name: 'CI: Cross-Platform Tests'

# Cross-platform testing for Windows support
# Tests shared utilities, IDE detection, and path handling
# Note: Plugin tests have been migrated to augur-data repo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-cross-platform.yml'
      - 'scripts/augur-codex-mcp.ps1'
      - 'scripts/windows-one-click-bootstrap.ps1'
      - 'project-brain/capabilities/skills/daemon/**'
      - 'project-brain/capabilities/skills/onboard/**'
      - 'src/cli_config/**'
      - 'src/config/**'
      - 'src/lib/**'
      - 'src/mcp/**'
      - 'apps/dashboard/app/api/cli/**'
      - 'apps/dashboard/lib/paths.ts'
      - 'apps/dashboard/lib/server/**'
      - 'apps/dashboard/playwright*.config.ts'
      - 'apps/dashboard/jest.config.js'
      - 'tests/scripts/test_windows_one_click_bootstrap.py'
      - 'tests/scripts/test_onboard_install_prompt.py'
      - 'tests/config/test_path_primitives.py'
      - 'tests/dashboard/api/cli-config.test.ts'
      - 'tests/dashboard/lib/paths-discovery.test.ts'
      - 'tests/packages/augur-mcp/test_packaging.py'
      - 'tests/packages/augur-mcp/tools/test_sync_agents_mcp_config.py'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-cross-platform.yml'
      - 'scripts/augur-codex-mcp.ps1'
      - 'scripts/windows-one-click-bootstrap.ps1'
      - 'project-brain/capabilities/skills/daemon/**'
      - 'project-brain/capabilities/skills/onboard/**'
      - 'src/cli_config/**'
      - 'src/config/**'
      - 'src/lib/**'
      - 'src/mcp/**'
      - 'apps/dashboard/app/api/cli/**'
      - 'apps/dashboard/lib/paths.ts'
      - 'apps/dashboard/lib/server/**'
      - 'apps/dashboard/playwright*.config.ts'
      - 'apps/dashboard/jest.config.js'
      - 'tests/scripts/test_windows_one_click_bootstrap.py'
      - 'tests/scripts/test_onboard_install_prompt.py'
      - 'tests/config/test_path_primitives.py'
      - 'tests/dashboard/api/cli-config.test.ts'
      - 'tests/dashboard/lib/paths-discovery.test.ts'
      - 'tests/packages/augur-mcp/test_packaging.py'
      - 'tests/packages/augur-mcp/tools/test_sync_agents_mcp_config.py'
  schedule:
    - cron: '0 6 * * 0'  # Weekly on Sunday at 06:00 AM UTC (GitHub-hosted runners)
  workflow_dispatch:
    inputs:
      os_matrix:
        description: 'Operating systems to test'
        type: choice
        options:
          - all
          - ubuntu-only
          - windows-only
          - macos-only
        default: 'all'

jobs:
  # ============================================
  # SHARED UTILITIES TESTS (Cross-Platform)
  # ============================================
  shared-utils-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']

    runs-on: ${{ matrix.os }}
    name: Shared Utils (${{ matrix.os }}, Python ${{ matrix.python-version }})

    # Python UTF-8 mode: Augur's text artifacts (SKILL.md, configs, generated
    # docs) are UTF-8. On Windows the default text encoding is cp1252, so plain
    # open()/read_text()/stdout hit charmap UnicodeEncode/DecodeError on glyphs
    # like → ≠. UTF-8 mode uses the correct encoding everywhere (no-op where the
    # locale is already UTF-8, i.e. ubuntu/macos).
    env:
      PYTHONUTF8: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Node.js
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        if: runner.os == 'Windows'
        run: corepack enable

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          . .venv/bin/activate
          uv pip install pytest pytest-cov pytest-asyncio pyyaml httpx tomli-w
          uv pip install -e src/mcp

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\Activate.ps1
          uv pip install pytest pytest-cov pytest-asyncio pyyaml httpx tomli-w
          uv pip install -e src/mcp

      - name: Run shared tests (Unix)
        if: runner.os != 'Windows'
        run: |
          . .venv/bin/activate
          export PYTHONPATH="project-brain/capabilities:.:src/mcp"
          pytest tests/ -v --tb=short --ignore=tests/integration/

      - name: Run shared tests (Windows)
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\Activate.ps1
          $env:PYTHONPATH = "project-brain/capabilities;.;src/mcp"
          # Disable the thread/unraisable-exception plugins on Windows CI: a
          # background daemon thread (spawned-server readers, asyncio loop) can
          # raise during interpreter shutdown, which these plugins escalate into
          # a session failure (exit 1) even when every test passed. Non-interactive
          # CI should not fail an all-green run on shutdown-thread noise.
          pytest tests/ -v --tb=short -p no:unraisableexception -p no:threadexception --ignore=tests/integration/
          Write-Host "pytest exit code: $LASTEXITCODE"

  # ============================================
  # PATH HANDLING TESTS (Cross-Platform)
  # ============================================
  path-handling-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']

    runs-on: ${{ matrix.os }}
    name: Path Handling (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Node.js
        if: runner.os == 'Windows'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        if: runner.os == 'Windows'
        run: corepack enable

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          . .venv/bin/activate
          uv pip install pytest pyyaml

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\Activate.ps1
          uv pip install pytest pyyaml

      - name: Test path resolution (Unix)
        if: runner.os != 'Windows'
        run: |
          . .venv/bin/activate
          python -c "from src.config.paths import get_project_root; print(get_project_root())"

      - name: Test path resolution (Windows)
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\Activate.ps1
          python -c "from src.config.paths import get_project_root, get_python_executable; print(get_project_root()); print(get_python_executable())"

      - name: Smoke test configure_mcp (Windows)
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\Activate.ps1
          $cursorConfig = Join-Path $env:RUNNER_TEMP "cursor.mcp.json"
          if (Test-Path $cursorConfig) { Remove-Item $cursorConfig -Force }
          python scripts/configure_mcp.py --client cursor --cursor-config $cursorConfig --auto --verbose
          if (-not (Test-Path $cursorConfig)) { throw "configure_mcp.py did not create $cursorConfig" }

      - name: Verify Windows one-click bootstrap contract
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\Activate.ps1
          $env:PYTHONPATH = "project-brain/capabilities;.;src/mcp"
          pytest tests/scripts/test_windows_one_click_bootstrap.py tests/scripts/test_onboard_install_prompt.py -q
          powershell -NoProfile -Command '$null = [scriptblock]::Create((Get-Content scripts/windows-one-click-bootstrap.ps1 -Raw)); "parser ok"'

      - name: Verify Windows Codex launcher shape
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\Activate.ps1
          $env:PYTHONPATH = "project-brain/capabilities;.;src/mcp"
          pytest tests/packages/augur-mcp/tools/test_sync_agents_mcp_config.py::TestConfigureMcpRuntimeArgs::test_codex_cli_config_uses_powershell_launcher_on_windows -q

      - name: Verify Windows dashboard path handling
        if: runner.os == 'Windows'
        working-directory: apps/dashboard
        run: |
          pnpm install --frozen-lockfile
          pnpm jest ../../tests/dashboard/lib/paths-discovery.test.ts ../../tests/dashboard/api/cli-config.test.ts --runInBand

  # ============================================
  # SERVICE HEALER TESTS (Cross-Platform)
  # ============================================
  service-healer-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']

    runs-on: ${{ matrix.os }}
    name: Service Healer (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create virtual environment
        run: uv venv

      - name: Install dependencies (Unix)
        if: runner.os != 'Windows'
        run: |
          . .venv/bin/activate
          uv pip install pytest pyyaml

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\Activate.ps1
          uv pip install pytest pyyaml

      - name: Smoke test daemon registration spec (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          .\.venv\Scripts\Activate.ps1
          $env:PYTHONPATH = "project-brain/capabilities;.;src/mcp"
          pytest project-brain/capabilities/skills/daemon/augur/tests/test_service_healer_registration.py project-brain/capabilities/skills/daemon/augur/tests/test_daemon.py -q

      - name: Verify Windows one-click orchestrator unit tests
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          .\.venv\Scripts\Activate.ps1
          $env:PYTHONPATH = "project-brain/capabilities;.;src/mcp"
          pytest project-brain/capabilities/skills/onboard/augur/tests/test_windows_one_click.py -q

      - name: Verify hardening platform contract (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          .\.venv\Scripts\Activate.ps1
          $env:PYTHONPATH = "project-brain/capabilities;.;src/mcp"
          python project-brain/capabilities/skills/daemon/scripts/adaptive/platform_verify.py --loop hardening --platform windows --mode verify

      - name: Test service_healer imports (Unix)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          . .venv/bin/activate
          python -c "
          import sys
          sys.path.insert(0, 'project-brain/capabilities/skills/daemon/scripts')
          try:
              from service_healer import get_project_root, heal_service_if_needed
              print(f'Platform: {sys.platform}')
              print(f'Project root: {get_project_root()}')
              result = heal_service_if_needed('log_monitor')
              print(f'Heal result (expected False on Linux): {result}')
          except ImportError as e:
              print(f'Service healer not available (daemon skill may not be installed): {e}')
          "

      - name: Test service_healer imports (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          .\.venv\Scripts\Activate.ps1
          python -c "
          import sys
          sys.path.insert(0, 'project-brain/capabilities/skills/daemon/scripts')
          try:
              from service_healer import get_project_root, heal_service_if_needed
              print(f'Platform: {sys.platform}')
              print(f'Project root: {get_project_root()}')
              result = heal_service_if_needed('daemon')
              print(f'Heal result: {result}')
          except ImportError as e:
              print(f'Service healer not available: {e}')
          "

      - name: Test log_monitor imports (Unix)
        if: runner.os != 'Windows'
        continue-on-error: true
        run: |
          . .venv/bin/activate
          python -c "
          import sys
          sys.path.insert(0, 'project-brain/capabilities/skills/daemon/scripts')
          try:
              from log_monitor import PROJECT_ROOT
              print(f'log_monitor PROJECT_ROOT: {PROJECT_ROOT}')
          except ImportError as e:
              print(f'log_monitor not available (daemon skill may not be installed): {e}')
          "

      - name: Test log_monitor imports (Windows)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: |
          .\.venv\Scripts\Activate.ps1
          python -c "
          import sys
          sys.path.insert(0, 'project-brain/capabilities/skills/daemon/scripts')
          try:
              from log_monitor import PROJECT_ROOT
              print(f'log_monitor PROJECT_ROOT: {PROJECT_ROOT}')
          except ImportError as e:
              print(f'log_monitor not available: {e}')
          "

  # ============================================
  # MCP SERVER TESTS (Cross-Platform)
  # ============================================
  mcp-server-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11']

    runs-on: ${{ matrix.os }}
    name: MCP Server (${{ matrix.os }})

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Create virtual environment
        run: uv venv

      - name: Install MCP package (Unix)
        if: runner.os != 'Windows'
        run: |
          . .venv/bin/activate
          uv pip install -e src/mcp

      - name: Install MCP package (Windows)
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\Activate.ps1
          uv pip install -e src/mcp

      - name: Test MCP imports (Unix)
        if: runner.os != 'Windows'
        run: |
          . .venv/bin/activate
          python -c "
          from src.mcp.augur_shared.config import get_project_root, get_config
          from src.mcp.augur_shared.context_manager import ContextManager
          print('MCP imports successful')
          print(f'Project root: {get_project_root()}')
          "

      - name: Test MCP imports (Windows)
        if: runner.os == 'Windows'
        run: |
          .\.venv\Scripts\Activate.ps1
          python -c "
          from src.mcp.augur_shared.config import get_project_root, get_config
          from src.mcp.augur_shared.context_manager import ContextManager
          print('MCP imports successful')
          print(f'Project root: {get_project_root()}')
          "
