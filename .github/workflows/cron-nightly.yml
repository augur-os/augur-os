name: 'Cron: Nightly Maintenance'

# Nightly maintenance jobs - backlog generation, failure analysis, dependency checks
# Consolidates: agent-nightly-backlog, agent-failure-review

on:
  schedule:
    - cron: '0 3 * * *'  # Every night at 03:00 AM UTC
  workflow_run:
    workflows: ["CI: Tests"]
    types:
      - completed
  workflow_dispatch:
    inputs:
      run_backlog:
        description: 'Generate agent backlogs'
        type: boolean
        default: true
      run_deps_check:
        description: 'Check for outdated dependencies'
        type: boolean
        default: true

jobs:
  # ============================================
  # CODE HEALTH (Nightly or Manual)
  # ============================================
  code-health:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: write

    steps:
      - name: Checkout Code Repo
        uses: actions/checkout@v4
        with:
          path: augur

      - name: Checkout Data Repo
        if: github.repository == 'augur-os/augur-os' && vars.AUGUR_DATA_REPOSITORY != ''
        continue-on-error: true
        uses: actions/checkout@v4
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          repository: ${{ vars.AUGUR_DATA_REPOSITORY }}
          token: ${{ env.GH_PAT }}
          path: augur-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system pyyaml

      - name: Scan code markers
        working-directory: augur
        run: |
          echo "=== Code Marker Scan ==="
          python .github/scripts/scan_code_markers.py --ci --summary || true

      - name: Track codebase metrics
        working-directory: augur
        env:
          AUGUR_ROOT: ${{ github.workspace }}/augur
        run: |
          echo "=== Codebase Metrics ==="
          python .github/scripts/track_codebase_metrics.py --save --json

      - name: Audit git hygiene
        working-directory: augur
        run: |
          echo "=== Git Hygiene ==="
          python .github/scripts/audit_git_hygiene.py || true

      - name: Scan stale paths
        working-directory: augur
        run: |
          echo "=== Stale Path Scanner ==="
          python .github/scripts/scan_stale_paths.py --ci

      - name: Track coverage metrics
        working-directory: augur
        run: |
          echo "=== Coverage Tracking ==="
          if [ -f ".github/scripts/coverage_tracker.py" ]; then
            python .github/scripts/coverage_tracker.py --save || true
          else
            echo "⚠️ Coverage tracker not yet available"
          fi

      - name: Rotate stale generated docs
        working-directory: augur
        run: |
          echo "=== Rotating Stale Generated Docs ==="
          python .github/scripts/cleanup_generated_docs.py --max-age-days 14 || true

      - name: Generate reference indexes (ADR-096)
        working-directory: augur
        run: |
          echo "=== Generating Reference Indexes ==="
          python .github/scripts/generate_skill_registry.py || true
          python .github/scripts/generate_route_map.py || true
          python .github/scripts/generate_adr_index.py || true
          python .github/scripts/scan_code_markers.py --summary > docs/generated/marker-report.md 2>&1 || true
          echo "=== Syncing Agent Topic Docs ==="
          PYTHONPATH="$PWD/project-brain/capabilities:$PWD:$PWD/src/mcp" python -m skills.ai.scripts.sync_agents sync all || true

      - name: Commit and Push Metrics
        if: github.repository == 'augur-os/augur-os' && vars.AUGUR_DATA_REPOSITORY != ''
        working-directory: augur-data
        run: |
          git config user.name "Augur Agent"
          git config user.email "agent@augur.ai"
          git add metrics/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No metric changes to commit."
          else
            git commit -m "chore: update nightly metrics [code-health]"
            git push
          fi

  # ============================================
  # FAILURE ANALYSIS (On CI Failure)
  # ============================================
  analyze-failure:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'failure'
    permissions:
      actions: read
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout Code Repo
        uses: actions/checkout@v4
        with:
          path: augur

      - name: Checkout Data Repo
        if: github.repository == 'augur-os/augur-os' && vars.AUGUR_DATA_REPOSITORY != ''
        continue-on-error: true
        uses: actions/checkout@v4
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          repository: ${{ vars.AUGUR_DATA_REPOSITORY }}
          token: ${{ env.GH_PAT }}
          path: augur-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Analyze Failure & Create Backlog Item
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Parse full event JSON to safely extract workflow_run data
          echo '${{ toJSON(github.event) }}' > event.json
          
          # Use jq to extract values safely
          PR_NUMBER=$(jq -r '.workflow_run.pull_requests[0].number // empty' event.json)
          RUN_ID=$(jq -r '.workflow_run.id // empty' event.json)

          echo "=== Analyzing CI Failure ==="
          echo "Run ID: $RUN_ID"
          echo "PR Number: ${PR_NUMBER:-N/A}"

          cd augur
          if [ -f "project-brain/capabilities/skills/platform-admin/scripts/ci_failure_analyzer.py" ]; then
            python project-brain/capabilities/skills/platform-admin/scripts/ci_failure_analyzer.py "$RUN_ID" "$PR_NUMBER" --backlog
          else
            echo "⚠️ Failure analyzer script not found"
          fi

      - name: Push Bug Reports
        if: always() && github.repository == 'augur-os/augur-os' && vars.AUGUR_DATA_REPOSITORY != ''
        working-directory: augur-data
        run: |
          git config user.name "Augur Agent"
          git config user.email "agent@augur.ai"
          git add bugs/ 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "No bugs to report."
          else
            git commit -m "chore: report ci failure bugs for run ${{ github.event.workflow_run.id }}"
            git push
          fi

  # ============================================
  # DEPENDENCY FRESHNESS CHECK (Nightly)
  # ============================================
  check-dependencies:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_deps_check != 'false')

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Check Python dependency freshness
        run: |
          echo "=== Checking Python Dependency Freshness ==="
          uv pip install --system pip-tools

          # Check if any pyproject.toml has outdated deps
          for toml in $(find . -name "pyproject.toml" -not -path "./.venv/*"); do
            echo "Checking $toml..."
            dir=$(dirname "$toml")
            cd "$dir"
            pip-compile --upgrade --dry-run 2>/dev/null | head -20 || echo "  (no changes)"
            cd - > /dev/null
          done

      - name: Enable corepack
        run: corepack enable

      - name: Install Node.js dependencies
        working-directory: apps/dashboard
        run: pnpm install --frozen-lockfile

      - name: Check Node.js dependency freshness
        working-directory: apps/dashboard
        run: |
          echo "=== Checking Node.js Dependency Freshness ==="
          pnpm outdated || true

  # ============================================
  # DEPENDENCY TRACKING STATUS
  # ============================================
  dependency-tracking:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install dependencies
        run: uv pip install --system pyyaml

      - name: Check dependency status
        run: |
          echo "=== Dependency Tracking Status ==="
          if [ -f "project-brain/capabilities/skills/platform-admin/scripts/dependency_tracker.py" ]; then
            python project-brain/capabilities/skills/platform-admin/scripts/dependency_tracker.py status || true
          else
            echo "⚠️ Dependency tracker not found"
          fi

  # ============================================
  # NIGHTLY SUMMARY
  # ============================================
  nightly-summary:
    runs-on: ubuntu-latest
    needs: [code-health, check-dependencies, dependency-tracking]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')

    steps:
      - name: Generate Nightly Summary
        env:
          CODE_HEALTH: ${{ needs.code-health.result }}
          CHECK_DEPS: ${{ needs.check-dependencies.result }}
          DEP_TRACKING: ${{ needs.dependency-tracking.result }}
        run: |
          DATE=$(date -u +"%Y-%m-%d")

          status_icon() {
            case "$1" in
              success) echo "✅" ;;
              failure) echo "❌" ;;
              skipped) echo "⏭️" ;;
              cancelled) echo "🚫" ;;
              *) echo "❓" ;;
            esac
          }

          {
            echo "## Nightly Run Summary — ${DATE}"
            echo ""
            echo "| Job | Status |"
            echo "|-----|--------|"
            echo "| Code Health | $(status_icon "$CODE_HEALTH") ${CODE_HEALTH} |"
            echo "| Dependency Freshness | $(status_icon "$CHECK_DEPS") ${CHECK_DEPS} |"
            echo "| Dependency Tracking | $(status_icon "$DEP_TRACKING") ${DEP_TRACKING} |"
            echo ""

            # Count results
            PASS=0
            FAIL=0
            for result in "$CODE_HEALTH" "$CHECK_DEPS" "$DEP_TRACKING"; do
              if [ "$result" = "success" ]; then
                PASS=$((PASS + 1))
              elif [ "$result" = "failure" ]; then
                FAIL=$((FAIL + 1))
              fi
            done

            TOTAL=$((PASS + FAIL))
            echo "**Jobs**: ${PASS}/${TOTAL} passed"
            echo ""

            if [ "$FAIL" -gt 0 ]; then
              echo "⚠️ **${FAIL} job(s) failed** — check workflow logs for details."
            else
              echo "All nightly maintenance jobs completed successfully."
            fi
            echo ""
            echo "---"
            echo "*Generated by Cron: Nightly Maintenance workflow*"
          } >> "$GITHUB_STEP_SUMMARY"
